function _locsKey(){ return 'cl_locs_'+(_siteId||'x')+'_'+(_presetTypeKey||_typeKey||'x'); }
function _locIdxKey(){ return 'cl_locidx_'+(_siteId||'x')+'_'+(_presetTypeKey||_typeKey||'x'); }
function _loadLocList(){
  try{ var r=localStorage.getItem(_locsKey()); _locList=r?JSON.parse(r):[]; }catch(e){ _locList=[]; }
  try{ var i=parseInt(localStorage.getItem(_locIdxKey())||'0'); _locIdx=isNaN(i)?0:Math.max(0,Math.min(i,Math.max(0,_locList.length-1))); }catch(e){ _locIdx=0; }
}
function _saveLocList(){
  localStorage.setItem(_locsKey(),JSON.stringify(_locList));
  localStorage.setItem(_locIdxKey(),String(_locIdx));
}
function _getLocProgress(hataNo){
  if(!hataNo) return null;
  var base='cl_state_'+(_siteId||'x')+'_'+(_presetTypeKey||_typeKey||'x');
  var raw=localStorage.getItem(base+'_h'+hataNo);
  if(!raw) return null;
  try{
    var d=JSON.parse(raw);
    var checks=d.checks||{};
    var done=Object.keys(checks).filter(function(k){ return checks[k]; }).length;
    return done;
  }catch(e){ return null; }
}
// 全箇所データをlocalStorageから一括ロード（N-checkbox描画用）
function loadAllLocData(){
  _locData = [];
  if(!_siteId||!_typeKey) return;
  var base='cl_state_'+(_siteId||'x')+'_'+(_presetTypeKey||_typeKey||'x');
  for(var i=0;i<_locList.length;i++){
    var h=_locList[i]||'';
    var key=h?base+'_h'+h:base+'_loc'+i;
    var d={checks:{},na:{},subChecks:{},dp1:'',dph:'',dp2:'',dph2:'',dp3:'',dph3:'',dp4:'',dph4:'',dp1s:'',dph1s:'',bh:'',extra:'',hata:h,rbMasterKey:'',kbn:'',ckType:''};
    try{ var r=localStorage.getItem(key); if(r) { var p=JSON.parse(r); Object.keys(p).forEach(function(k){ d[k]=p[k]; }); } }catch(e){}
    // kbnが未設定の場合はグローバル_kojiKbnを引き継ぐ（旧データ互換）
    if(!d.kbn) d.kbn = _kojiKbn || 'kari';
    _locData.push(d);
  }
  // 未ロードのDP値を旗揚げマスタから補完（多箇所モード 土被り表示用）
  if(_locData.length>=2){
    var _allHataMs=[];
    try{
      if(_siteId){var _sh=localStorage.getItem('hata_master_'+_siteId);if(_sh){var _sp=JSON.parse(_sh);if(Array.isArray(_sp))_allHataMs=_allHataMs.concat(_sp);}}
      var _gh=localStorage.getItem('hata_master');if(_gh){var _gp=JSON.parse(_gh);if(Array.isArray(_gp))_allHataMs=_allHataMs.concat(_gp);}
    }catch(e){}
    _locData.forEach(function(ld){
      if(!ld.hata||(ld.dp1!==''&&parseFloat(ld.dp1||0)>0)) return;
      var _e=_allHataMs.find(function(e){return String(e.hata||e.num||'')===String(ld.hata);});
      if(!_e) return;
      var _dp=_e.dp!=null?_e.dp:(_e.dp1!=null?_e.dp1:(_e.rangeFrom!=null?_e.rangeFrom:null));
      var _dph=_e.dph!=null?_e.dph:(_e.kanH!=null?_e.kanH:(_e.dph1!=null?_e.dph1:null));
      if(_dp!=null) ld.dp1=String(_dp);
      if(_dph!=null) ld.dph=String(_dph);
      if(_e.dp2){ld.dp2=String(_e.dp2);ld.dph2=String(_e.dph2||'');}
      if(_e.name) ld.hataName=_e.name;
    });
  }
}

    var k=row.getAttribute('data-k');

    _locData.forEach(function(ld,li){
      var box=row.querySelector('.chk-loc-'+Math.min(li,2)+'[data-loc="'+li+'"]');

      var on=!!ld.checks[k];

      box.textContent=naFlag?'—':(on?'✓':'');

    var anyDone=_locData.some(function(d){ return !!d.checks[k]; });

    row.classList.toggle('checked',anyDone);
    row.classList.toggle('na',allNA);
  });
  // combo-seq-row内のN-チェックボックスも更新
  document.querySelectorAll('.combo-seq-row[data-subchk-key]').forEach(function(row){
    var key=row.getAttribute('data-subchk-key');
    if(!key) return;
    _locData.forEach(function(ld,li){
      var box=row.querySelector('.chk-loc-'+Math.min(li,2)+'[data-loc="'+li+'"]');
      if(!box) return;
      var on=!!(ld.subChecks&&ld.subChecks[key]);
      box.classList.toggle('on',on);
      box.textContent=on?'✓':'';

// 各箇所のDP値から埋設シートのGLを計算（勾配あり→"深側X ～ 浅側Y"形式）
function _locSheetGL(locIdx){
  var d=_locData[locIdx];
  if(!d) return null;
  var dp1=parseFloat(d.dp1)||0;
  if(dp1<=0) return null;
  var tk=_typeKey||'85';
  var emb=(EMBED_MM[tk]||300)/1000;
  var dp1s=parseFloat(d.dp1s)||0;
  if(dp1s>0 && Math.abs(dp1s-dp1)>0.0005){
    // 勾配あり: 起点(dp1側)と終点(dp1s側)の両方を返す
    return (dp1-emb).toFixed(3)+'～'+(dp1s-emb).toFixed(3);
  }
  return (dp1-emb).toFixed(3);
}

}
function switchLocation(idx){
  if(idx===_locIdx) return;
  // マルチ箇所モード時: 現在チェック状態を_locDataに同期してから保存
  if(_locData.length>=2){ syncCurrentToLocData(); saveLocDataState(_locIdx); }
  else { saveState(); }
  _locIdx=idx;
  _saveLocList();
  _checks={}; _naItems={}; _subChecks={};
  // 全箇所データを再ロード（rbMasterKey・DP値含む）
  loadAllLocData();
  // 路盤構成パネル・チェックリスト項目をアクティブ箇所で再構築
  // （内部でrestoreState/recalcGL/renderLocTabs/updateProgress/_rebuildLocRbSelect呼出）
  renderMain();
  // renderMain→restoreStateでhataInputが空になるので再セット＆DP再読込
  var h=_locList[_locIdx]||'';
  var hEl=document.getElementById('hataInput');
  if(hEl) hEl.value=h;
  if(h){ _hataEntry=null; loadHata(); }
  else{ _hataEntry=null; var ie=document.getElementById('hataInfo'); if(ie)ie.innerHTML=''; closeDiagram(); recalcGL(); }
  // マルチ箇所モード時はチェックボックスを再描画して同期
  if(_locData.length>=2) _refreshLocCheckboxes();
}
function addLocation(){
  saveState();
  if(_locList.length===0){
    // 初回: 現在の旗揚げ番号を1箇所目として登録
    var curH=($v('hataInput')||'').trim();
    _locList.push(curH);
  }
  _locList.push('');
  _locIdx=_locList.length-1;
  _saveLocList();
  _checks={}; _naItems={}; _subChecks={};
  loadAllLocData(); // 全箇所データを再ロード
  var hEl=document.getElementById('hataInput');
  if(hEl) hEl.value='';
  _hataEntry=null;
  var ie=document.getElementById('hataInfo'); if(ie)ie.innerHTML='';
  closeDiagram();
  // チェックリスト全体を再描画（N-chk列追加・路盤マスク・凡例バーを正しく反映）
  renderMain();
}
function removeLocation(idx){
  if(_locList.length<=1){ alert('最後の箇所は削除できません'); return; }
  var lab=_locList[idx]?'NO.'+_locList[idx]:'（未入力）';
  if(!confirm(lab+' を削除しますか？\nこの箇所のチェック状態も削除されます。')) return;
  var hataToRemove=_locList[idx];
  if(hataToRemove){
    var base='cl_state_'+(_siteId||'x')+'_'+(_presetTypeKey||_typeKey||'x');
    localStorage.removeItem(base+'_h'+hataToRemove);
  }
  _locList.splice(idx,1);
  if(_locIdx>=_locList.length) _locIdx=_locList.length-1;
  _saveLocList();
  var h=_locList[_locIdx]||'';
  var hEl=document.getElementById('hataInput');
  if(hEl) hEl.value=h;
  renderMain(); // N-チェックボックス列を即時再描画（内部でrestoreState/recalcGL/renderLocTabs/updateProgress呼出）
}

function saveState(){
  if(!_siteId||!_typeKey) return;
  var data = {
    date:$v('inDate'),mgmt:$v('inMgmtNo'),rec:$v('inRecorder'),
    dp1:$v('inDP1'),dp2:$v('inDP2'),dph:$v('inDPH'),dph2:$v('inDPH2'),dp3:$v('inDP3'),dph3:$v('inDPH3'),dp4:$v('inDP4'),dph4:$v('inDPH4'),bh:$v('inBH'),extra:$v('inExtra'),pipeCount:_pipeCount,pipeTypes:_pipeTypes,pipeCustomNames:_pipeCustomNames,showDummy:_showDummy,pipeGradient:_pipeGradient,
    dp1s:$v('inDP1s'),dph1s:$v('inDPH1s'),dp2s:$v('inDP2s'),dph2s:$v('inDPH2s'),dp3s:$v('inDP3s'),dph3s:$v('inDPH3s'),dp4s:$v('inDP4s'),dph4s:$v('inDPH4s'),
    hata:$v('hataInput'),checks:_checks,na:_naItems,subChecks:_subChecks,kojiKbn:_kojiKbn,kussKbn:_kussuri_kbn
  };
  localStorage.setItem(storeKey(), JSON.stringify(data));
}
function restoreState(){
  var raw = localStorage.getItem(storeKey());
  if(!raw) return;
  try{
    var d = JSON.parse(raw);
    sv('inDate',d.date); sv('inMgmtNo',d.mgmt); sv('inRecorder',d.rec);
    if(d.pipeCount) _pipeCount = d.pipeCount;
    if(d.pipeTypes) _pipeTypes = d.pipeTypes;
    if(d.pipeCustomNames) _pipeCustomNames = d.pipeCustomNames;
    if(d.showDummy   !== undefined) _showDummy   = d.showDummy;
    if(d.showOdawara !== undefined) _showOdawara = d.showOdawara;
    if(d.pipeGradient !== undefined) _pipeGradient = d.pipeGradient;
    // 勾配②端DP値をDOM生成後（renderMain後）に適用するため仮保存
    _pendingSlope = {
      inDP1s:d.dp1s||'', inDPH1s:d.dph1s||'',
      inDP2s:d.dp2s||'', inDPH2s:d.dph2s||'',
      inDP3s:d.dp3s||'', inDPH3s:d.dph3s||'',
      inDP4s:d.dp4s||'', inDPH4s:d.dph4s||''
    };
    // GL計算欄・旗揚げ番号は起動時にクリア（前回の情報を引き継がない）
    ['inDP1','inDP2','inDPH','inDPH2','inBH','inExtra'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.value='';
    });
    var hataEl = document.getElementById('hataInput');
    if(hataEl) hataEl.value = '';
    _hataEntry = null;
    closeDiagram();
    _checks = d.checks||{}; _naItems = d.na||{}; _subChecks = d.subChecks||{};
    if(d.kojiKbn)  _kojiKbn     = d.kojiKbn;
    if(d.kussKbn)  _kussuri_kbn = d.kussKbn;
  }catch(e){}
}
function $v(id){ var el=document.getElementById(id); return el?el.value:''; }
function sv(id,v){ var el=document.getElementById(id); if(el&&v!==undefined&&v!==null&&v!=='') el.value=v; }

function renderMain(){
  // 多箇所モード: 箇所別kbnから施工区分(_kojiKbn)と掘削路盤確認(_kussuri_kbn)を計算
  // ※ _locData は前回renderMainのloadAllLocDataで更新済み（or setLocKbnで直接更新済み）
  if (_locData.length >= 2) {
    var _lkbns = _locData.map(function(ld){ return ld.kbn || 'kari'; });
    var _mlAllHon  = _lkbns.every(function(k){ return k === 'hon'; });
    var _mlAnyHon  = _lkbns.some(function(k){ return k === 'hon'; });
    var _mlAnyKari = _lkbns.some(function(k){ return k !== 'hon'; });
    if (_mlAllHon)       _kojiKbn = 'hon';
    else if (_mlAnyHon)  _kojiKbn = 'both';  // 混在: 両セクション表示
    else                 _kojiKbn = 'kari';
    // 掘削路盤確認も連動
    _kussuri_kbn = (_mlAnyHon && _mlAnyKari) ? 'both' : (_mlAllHon ? 'hon' : 'kari');
  } else if (_locData.length === 1 && _locData[0] && _locData[0].kbn) {
    // 単一箇所モード: 箇所別kbnを_kojiKbnに反映（ウィザード完了直後などlocDataが既に設定済みの場合）
    _kojiKbn = _locData[0].kbn;
    _kussuri_kbn = _locData[0].kbn;
  }

  // ── 箇所別ckType混在検出 ─────────────────────────────────────
  _isMixedCkType = false;
  _curLocCkType = _typeKey;
  if (_locData.length >= 2) {
    var _lects = _locData.map(function(ld){ return ld.ckType || _typeKey; });
    _isMixedCkType = _lects.some(function(t){ return t !== _lects[0]; });
    if (_isMixedCkType) {
      _curLocCkType = (_locData[_locIdx] && _locData[_locIdx].ckType) || _typeKey;
    }
  }

  // プリセットから動的チェックリストを取得（あれば優先使用）
  // _presetTypeKey（プリセット元キー）を優先して正確に型を取得
  var _presetType = getPresetTypeData(_siteId, _typeKey, _presetTypeKey);

  // 箇所別路盤レイヤー計算（複数箇所モード時）
  _locRbData = [];
  if (_presetType && _locData.length >= 2) {
    var _mainRbData = _computeLocRbLayers(_presetType);
    for (var _li = 0; _li < _locData.length; _li++) {
      var _lpt = _getLocPresetType(_li);
      if (_lpt) {
        _locRbData.push(_computeLocRbLayers(_lpt));
      } else {
        // rbMasterKey未設定のフォールバック:
        // 本復旧箇所はhon路盤データを空にして_mainRbData(他箇所のRC/RM)が誤継承されないよう防ぐ
        var _ldKbnFallback = (_locData[_li] && _locData[_li].kbn) || 'kari';
        if (_ldKbnFallback === 'hon') {
          _locRbData.push(Object.assign({}, _mainRbData, { honRcLayers: [], honRmLayers: [], honFreeLayers: [] }));
        } else {
          _locRbData.push(_mainRbData);
        }
      }
    }
  }

  // buildChecklistFromPresetには最多転圧ステップ数のpresetTypeを使用
  var _basePt = _presetType;
  if (_locRbData.length >= 2) {
    // 多箇所モード: 最多ステップの箇所のpresetTypeをベースに使用
    var _baseSteps = (_mainRbData.rcLayers.length + _mainRbData.rmLayers.length);
    for (var _li2 = 0; _li2 < _locRbData.length; _li2++) {
      var _lSteps = _locRbData[_li2].rcLayers.length + _locRbData[_li2].rmLayers.length;
      if (_lSteps > _baseSteps) {
        _baseSteps = _lSteps;
        var _lpt2 = _getLocPresetType(_li2);
        if (_lpt2) _basePt = _lpt2;
      }
    }
  } else {
    // 単一箇所モード: 箇所別路盤構成セレクタが設定されていればそれを優先
    var _locPt0 = _getLocPresetType(_locIdx);
    if (_locPt0) _basePt = _locPt0;
    // locRbDataも単一箇所用に設定（_rbStepNotesやlabelで参照）
    if (_basePt && _basePt !== _presetType) {
      _locRbData = [_computeLocRbLayers(_basePt)];
    }
  }

  var _dynChecklist = _basePt ? buildChecklistFromPreset(_basePt) : null;

  // 箇所別路盤ステップマスク: 各箇所のステップ数が少ない場合にチェックボックスをグレーアウト
  if (_locRbData.length >= 2 && _dynChecklist) {
    (_dynChecklist.sections || []).forEach(function(sec) {
      sec.items.forEach(function(item) {
        if (!item._rbStepType) return;
        var mask = {}, anyMasked = false;
        _locData.forEach(function(ld, li) {
          var lrd = _locRbData[li];
          var arr = !lrd ? [] :
            item._rbStepType === 'kariRc' ? lrd.rcLayers :
            item._rbStepType === 'kariRm' ? lrd.rmLayers :
            item._rbStepType === 'honRc'  ? lrd.honRcLayers :
            item._rbStepType === 'honRm'  ? lrd.honRmLayers : [];
          var has = arr.length > (item._rbStepIdx || 0);
          mask[li] = has;
          if (!has) anyMasked = true;
        });
        if (anyMasked) item._locMask = mask;
      });
    });
  }

  // 箇所別AS層データ（基層転圧/表層転圧マスク用）
  var _locAsData = [];
  if (_locRbData.length >= 2) {
    for (var _ai = 0; _ai < _locData.length; _ai++) {
      _locAsData.push(_getLocAsData(_ai, _presetType));
    }
  }
  // 多箇所モード: RC/RM転圧項目をGL値別に展開 + AS転圧マスク適用
  // _dynHonBurial も一時的にsectionsに含めて本復旧RC/RM項目も箇所別展開する
  if (_locRbData.length >= 2 && _dynChecklist) {
    var _honBurialTemp = _dynChecklist._dynHonBurial;
    if (_honBurialTemp && _honBurialTemp.items) {
      _dynChecklist.sections.push(_honBurialTemp);
      // honFreeテンプレート注入: genkyoFreeRows を持つlocがあれば honFree stepType テンプレートを追加
      // （buildChecklistFromPreset は _basePt 基準なので他locのfree層をカバーするため）
      var _hasHonFreeData = _locRbData.some(function(lrd){ return lrd && (lrd.honFreeLayers||[]).length>0; });
      var _hasHonFreeTpl = _honBurialTemp.items.some(function(it){ return it._rbStepType==='honFree'; });
      if (_hasHonFreeData && !_hasHonFreeTpl) {
        // honRm または honRc テンプレートの直後に挿入（施工順: RC→RM→Free の順に追加）
        var _freeInsIdx = _honBurialTemp.items.length;
        for (var _fii = _honBurialTemp.items.length - 1; _fii >= 0; _fii--) {
          var _fitp = _honBurialTemp.items[_fii]._rbStepType;
          if (_fitp === 'honRm' || _fitp === 'honRc') { _freeInsIdx = _fii + 1; break; }
        }
        _honBurialTemp.items.splice(_freeInsIdx, 0, {
          n: '本復旧　路盤転圧',
          note: '路盤を敷き均しランマーで転圧している状況を撮影。転圧後にスケールで厚さを確認し、黒板にGL値を記載して撮影すること。',
          _rbStepType: 'honFree',
          _rbStepIdx: 0
        });
      }
    }
    _expandLocRbItems(_dynChecklist, _locRbData, _locData, _locAsData);
    if (_honBurialTemp && _honBurialTemp.items) _dynChecklist.sections.pop();
  }

  var ck;
  if (_isMixedCkType) {
    // 混在型モード: 現在タブ箇所の ckType でテンプレートを個別選択
    var _mixLocPt = _getLocPresetType(_locIdx);
    ck = _mixLocPt ? buildChecklistFromPreset(_mixLocPt) : (TYPE_CHECKLISTS[_curLocCkType] || TYPE_CHECKLISTS[_typeKey]);
  } else {
    ck = _dynChecklist ? _dynChecklist : TYPE_CHECKLISTS[_typeKey];
  }

  // 仮復旧路盤が未登録（totalH=0）かつ本復旧路盤がある場合は自動で本復旧タブを選択
  // ただしユーザーが明示的に仮復旧を選んでいた場合（前回保存）はそちらを尊重しない
  // → 保存時に kojiKbn が 'kari' のまま残るケースは「本復旧のみ」構成と見なして自動切替
  // ※ 多箇所モード(_locData.length>=2)では箇所別kbnから既に計算済みのため自動切替不要
  if (_locData.length < 2 && _presetType && _kojiKbn === 'kari') {
    var _kariTotal = (_presetType.totalH || 0);
    var _honHasData = (_presetType.genkyoRC||0) > 0 || (_presetType.genkyoRM||0) > 0
                   || (_presetType.genkyoAsH||0) > 0 || (_presetType.genkyoTotalH||0) > 0;
    if (_kariTotal === 0 && _honHasData) {
      _kojiKbn = 'hon';
    }
  }

  var html = '<main>';

  // 基本情報パネル（最上部）
  html += '<div class="input-panel">' +
    '<div class="panel-title">基本情報</div>' +
    '<div class="field-row c2">' +
      '<div class="field"><label>作業日</label><input type="date" id="inDate" onchange="saveState()"></div>' +

    '<div class="field-row c2">' +

  }

  // 旗揚げエリア（基本情報の直下）
  html +=
    '<div class="hata-area">' +

      '</div>' +
      (function(){
        // 施工区分トグル: 旗揚げエリアに箇所別で表示
        var _ck = (_locData[_locIdx] && _locData[_locIdx].kbn) || _kojiKbn || 'kari';
        return '<div style="margin-top:6px;display:flex;align-items:center;gap:6px;">' +

            '<button class="seg-btn' + (_ck==='kari'?' active kari':'') + '" style="font-size:14px;padding:6px 4px;" onclick="setLocKbn(\'kari\')">仮復旧</button>' +

          '</div>' +
        '</div>';
      })() +
      '<button class="btn-sm" id="debugBtn" style="display:none;background:#555;font-size:14px;margin-top:4px" onclick="debugHataEntry()">🔍 DEBUG</button>' +

    // 図面展開エリア（旗揚げエリア直下）
    '<div class="hata-diagram" id="hataDiagram">' +
      '<div class="diagram-head">' +
        '<span class="dtitle" id="diagTitle">📐 図面</span>' +
        '<div id="ckDiagZoomCtrl" style="display:none;">' +
          '<button onclick="_ckDiagZoom(-0.25)" title="縮小">－</button>' +

          '<button onclick="_ckDiagZoomReset()" style="font-size:13px;padding:3px 8px;">Reset</button>' +

  if(ck){

    // 路盤構成 簡易表示＋詳細ボタン（orderの表示と統一・写真は層ごとに撮るため層数を明示／計算リストの直下に表示）

      var _locActivePt = _getLocPresetType(_locIdx);
      if (_locActivePt) {
        var _locActiveCk = buildChecklistFromPreset(_locActivePt);
        if (_locActiveCk && _locActiveCk.roadbedInfo) _rbInfo = _locActiveCk.roadbedInfo;
      }
    }
    if(_rbInfo){
      var rb = _rbInfo;
      var _rbDiffers = (rb._differs !== undefined) ? rb._differs : _ckKariHonDiffers(_presetType);
      var _rbTitle = _rbDiffers ? '仮復旧・路盤先行 構成（固定値）' : '路盤構成';
      var _asDesc = rb.asLayers.map(function(a){ return a.name+' t='+Math.round(a.t*1000)+'mm'; }).join(' ／ ');
      var _noticeParts = [];
      if(_asDesc) _noticeParts.push(_asDesc);

      if(rb.rcH>0) _noticeParts.push('<span style="color:#059669;font-weight:700;">'+(rb.rcLabel||'RC-'+rb.rcSize)+' '+ckLayerCompactStr(rb._kariRC_layers, rb.rcH*1000)+'</span>');
      (rb.extraMaterials||[]).forEach(function(em){

      });
      if(rb.teppan&&rb.teppan.use) _noticeParts.push('<span style="color:#b45309;font-weight:700;">🔩 鉄板'+(rb.teppan.pending?'（仕様未定）':'')+'</span>');
      var _rbDetailId = 'ckRbDetail_'+((_presetType&&_presetType.key)||_typeKey||'x');
      // 詳細パネル用チップ生成（仮復旧／現況・本復旧 共通フォーマット・orderのbuildRoadbedChipsに準拠）
      var _ckRbAsChip = function(name, tmm){
        return '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#1e40af;margin-bottom:3px;">'+name+'</div><div style="font-weight:700;font-size:16px;color:#2563eb;font-family:monospace;">t = '+tmm+'mm</div></div>';
      };
      var _ckRbRmcChip = function(label, val, tone){
        var bg = (tone==='hon') ? '#ede9fe' : '#d1fae5';
        var bd = (tone==='hon') ? '#ddd6fe' : '#a7f3d0';
        var lc = (tone==='hon') ? '#5b21b6' : '#065f46';
        var vc = (tone==='hon') ? '#7c3aed' : '#059669';
        return '<div style="background:'+bg+';border:1px solid '+bd+';border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:'+lc+';margin-bottom:3px;">'+label+'</div><div style="font-weight:700;font-size:16px;color:'+vc+';font-family:monospace;">'+val+'</div></div>';
      };
      // 🔧 仮復旧（路盤先行）側チップ：AS層 → 上層路盤工RM → 下層路盤工RC
      var _kariChips = [];
      (rb.asLayers||[]).forEach(function(a){ _kariChips.push(_ckRbAsChip(a.name, Math.round((a.t||0)*1000))); });
      if(rb.rmH>0) {
        var _kariRmChipLabel = (rb.rmLabel && !String(rb.rmLabel).startsWith('RM-')) ? rb.rmLabel : ('上層路盤工 RM-'+rb.rmSize);
        _kariChips.push(_ckRbRmcChip(_kariRmChipLabel, ckLayerAdditionStr(rb._kariRM_layers, rb.rmH*1000), 'kari'));
      }
      if(rb.rcH>0) _kariChips.push(_ckRbRmcChip('下層路盤工 RC-'+rb.rcSize, ckLayerAdditionStr(rb._kariRC_layers, rb.rcH*1000), 'kari'));
      // 🏗 現況・本復旧側チップ：honAsLayersが無い場合はgenkyoAsHから単層フォールバック
      var _honAsArr = (rb.honAsLayers && rb.honAsLayers.length) ? rb.honAsLayers
        : ((rb.genkyoAsH||0) > 0 ? [{name:'AS混合物', t: Math.round(rb.genkyoAsH*1000)}] : []);
      // 現況・本復旧チップ: honFreeRows があれば層順に展開
      var _honChips = [];
      var _frsHon = (rb.honFreeRows||[]).filter(function(r){ return (r.t||0)>0; });
      if(_frsHon.length > 0){
        _frsHon.forEach(function(r){
          if(r.type==='concrete'||r.type==='コンクリート'){
            _honChips.push('<div style="background:#fff7ed;border:1px solid #f97316;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#c2410c;margin-bottom:3px;">'+(r.name||'コンクリート')+'</div><div style="font-weight:700;font-size:16px;color:#f97316;font-family:monospace;">'+r.t+'mm</div></div>');
          } else if(r.type==='cn_rc'){
            _honChips.push('<div style="background:#fff7ed;border:1px solid #fb923c;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#c2410c;margin-bottom:3px;">CN間路盤材 '+(r.subcat||'RC-40')+'（別途発注）</div><div style="font-weight:700;font-size:16px;color:#fb923c;font-family:monospace;">'+r.t+'mm</div></div>');
          } else if(r.type==='upper_rb'){
            _honChips.push(_ckRbRmcChip('上層路盤工 '+(r.subcat||'RM-40'), ckLayerAdditionStr(rb._honRM_layers, rb.genkyoRM*1000), 'hon'));
          } else if(r.type==='lower_rb'){
            _honChips.push(_ckRbRmcChip('下層路盤工 '+(r.subcat||'RC-40'), ckLayerAdditionStr(rb._honRC_layers, rb.genkyoRC*1000), 'hon'));
          }
        });
        // cn_rc型行が無くてもgenkyoCnRCがある場合（旧ロジック計算値）はフォールバック
        var _frsHonHasCnRc = _frsHon.some(function(r){ return r.type==='cn_rc'; });
        if(!_frsHonHasCnRc && (rb.genkyoCnRC||0)>0){ var _cnRcSubFB=rb.genkyoCnRCSubcat||'RM-40'; _honChips.push('<div style="background:#fff7ed;border:1px solid #fb923c;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#c2410c;margin-bottom:3px;">CN間路盤材 '+_cnRcSubFB+'（別途発注）</div><div style="font-weight:700;font-size:16px;color:#fb923c;font-family:monospace;">'+Math.round(rb.genkyoCnRC*1000)+'mm</div></div>'); }
      } else {
        _honAsArr.forEach(function(a){ _honChips.push(_ckRbAsChip(a.name, a.t)); });
        if((rb.genkyoCnH||0)>0) _honChips.push('<div style="background:#fff7ed;border:1px solid #f97316;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#c2410c;margin-bottom:3px;">コンクリート層</div><div style="font-weight:700;font-size:16px;color:#f97316;font-family:monospace;">'+Math.round(rb.genkyoCnH*1000)+'mm</div></div>');
        if((rb.genkyoCnRC||0)>0){ var _cnRcSub=rb.genkyoCnRCSubcat||'RC-40'; _honChips.push('<div style="background:#fff7ed;border:1px solid #fb923c;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#c2410c;margin-bottom:3px;">CN間路盤材 '+_cnRcSub+'（別途発注）</div><div style="font-weight:700;font-size:16px;color:#fb923c;font-family:monospace;">'+Math.round(rb.genkyoCnRC*1000)+'mm</div></div>'); }
        if((rb.genkyoRM||0)>0) _honChips.push(_ckRbRmcChip('上層路盤工 RM-'+(rb.honRmSize||rb.rmSize), ckLayerAdditionStr(rb._honRM_layers, rb.genkyoRM*1000), 'hon'));
        if((rb.genkyoRC||0)>0) _honChips.push(_ckRbRmcChip('下層路盤工 RC-'+(rb.honRcSize||rb.rcSize), ckLayerAdditionStr(rb._honRC_layers, rb.genkyoRC*1000), 'hon'));
        // フリー層（既設路盤など）
        (rb.genkyoFreeRows||[]).forEach(function(r){
          if((r.t||0)>0){
            var nm=r.name||'フリー層';
            _honChips.push('<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:7px;padding:8px 12px;"><div style="font-size:13px;color:#92400e;margin-bottom:3px;">'+nm+'</div><div style="font-weight:700;font-size:16px;color:#d97706;font-family:monospace;">t = '+r.t+'mm</div></div>');
          }
        });
      }
      // 現況・本復旧 notice用 層展開ヘルパー
      var _buildHonNotice = function(rb){
        var frs = (rb.honFreeRows||[]).filter(function(r){ return (r.t||0)>0; });
        var parts = [];
        if(frs.length){
          frs.forEach(function(r){
            if(r.type==='concrete'||r.type==='コンクリート')
              parts.push('<span style="color:#f97316;font-weight:700;">'+(r.name||'コンクリート')+' '+r.t+'mm</span>');
            else if(r.type==='cn_rc')
              parts.push('<span style="color:#fb923c;font-weight:700;">CN間路盤材 '+(r.subcat||'RC-40')+' '+r.t+'mm（別途発注）</span>');
            else if(r.type==='upper_rb')
              parts.push('<span style="color:#0284c7;font-weight:700;">'+(r.subcat||'RM-40')+' '+r.t+'mm</span>');
            else if(r.type==='lower_rb')
              parts.push('<span style="color:#059669;font-weight:700;">'+(r.subcat||'RC-40')+' '+r.t+'mm</span>');
          });
          // cn_rc型行が無くてもgenkyoCnRCがある場合（旧ロジック計算値）はフォールバック
          var _bnHasCnRc = frs.some(function(r){ return r.type==='cn_rc'; });
          if(!_bnHasCnRc && (rb.genkyoCnRC||0)>0) parts.push('<span style="color:#fb923c;font-weight:700;">CN間路盤材 '+(rb.genkyoCnRCSubcat||'RM-40')+' '+Math.round(rb.genkyoCnRC*1000)+'mm（別途発注）</span>');
        } else {
          if((rb.genkyoCnH||0)>0) parts.push('<span style="color:#f97316;font-weight:700;">コンクリート '+Math.round(rb.genkyoCnH*1000)+'mm</span>');
          if((rb.genkyoCnRC||0)>0) parts.push('<span style="color:#fb923c;font-weight:700;">CN間路盤材 '+(rb.genkyoCnRCSubcat||'RC-40')+' '+Math.round(rb.genkyoCnRC*1000)+'mm（別途発注）</span>');
          // AS層：honAsLayersがあれば展開、なければgenkyoAsHから単層フォールバック
          if((rb.genkyoAsH||0)>0){
            var _bhnAsArr = (rb.honAsLayers&&rb.honAsLayers.length) ? rb.honAsLayers : [{name:'AS混合物', t:Math.round(rb.genkyoAsH*1000)}];
            _bhnAsArr.forEach(function(a){ parts.push('<span style="color:#7c3aed;font-weight:700;">'+a.name+' '+a.t+'mm</span>'); });
          }
          if((rb.genkyoRM||0)>0) parts.push('<span style="color:#0284c7;font-weight:700;">RM-'+(rb.honRmSize||rb.rmSize||40)+' '+Math.round(rb.genkyoRM*1000)+'mm</span>');
          if((rb.genkyoRC||0)>0) parts.push('<span style="color:#059669;font-weight:700;">RC-'+(rb.honRcSize||rb.rcSize||40)+' '+Math.round(rb.genkyoRC*1000)+'mm</span>');
          // フリー層（既設路盤など RM/RC 以外の路盤工層）
          (rb.genkyoFreeRows||[]).forEach(function(r){
            if((r.t||0)>0) parts.push('<span style="color:#d97706;font-weight:700;">'+(r.name||'フリー層')+' '+r.t+'mm</span>');
          });
        }
        return parts.join(' ／ ');
      };
      var _honTotalMm = Math.round(((rb.genkyoTotalH||0)||((rb.genkyoAsH||0)+(rb.genkyoRM||0)+(rb.genkyoRC||0)+(rb.genkyoCnRC||0)+(rb.genkyoCnH||0)+(rb.genkyoFreeH||0)))*1000)||Math.round(rb.totalH*1000);
      var _kariWarnBadge = _rbDiffers ? ' <span style="display:inline-block;margin-left:6px;background:#fee2e2;color:#dc2626;font-size:13px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;">⚠️ 現況路盤は異なる</span>' : '';
      var _honWarnBadge  = _rbDiffers ? ' <span style="display:inline-block;margin-left:6px;background:rgba(239,68,68,0.2);color:#b91c1c;font-size:13px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;">⚠️ 仮復旧路盤は異なる</span>' : '';
      html += '<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:8px 12px;margin:10px 0;">'
        +'<div style="font-size:16px;color:#0369a1;line-height:1.7;">📐 <strong>仮復旧・路盤先行 構成（固定値） H='+Math.round(rb.totalH*1000)+'mm</strong>： '+_noticeParts.join(' ／ ')+_kariWarnBadge
        +'</div>'
        +(_rbDiffers
          ? '<div style="font-size:16px;color:#7c3aed;line-height:1.7;margin-top:4px;">🏗 <strong>現況・本復旧 H='+_honTotalMm+'mm</strong>： '+_buildHonNotice(rb)+_honWarnBadge+'</div>'
          : '')
        +'</div>'
        +'<button id="'+_rbDetailId+'-btn" type="button" onclick="toggleCkRoadbedDetail(\''+_rbDetailId+'\')" style="margin-top:6px;font-size:13px;font-weight:700;color:#0369a1;background:#e0f2fe;border:1px solid #bae6fd;border-radius:5px;padding:3px 10px;cursor:pointer;">詳細を見る ▼</button>'
        +'<div id="'+_rbDetailId+'" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid #bae6fd;">'
          +((_rbDiffers && _honChips.length)
            ? ('<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
                +'<div><div style="font-size:12px;font-weight:700;color:#ea580c;letter-spacing:1px;margin-bottom:5px;">🔧 仮復旧（路盤先行）</div><div style="display:flex;flex-direction:column;gap:5px;">'+_kariChips.join('')+'</div></div>'
                +'<div><div style="font-size:12px;font-weight:700;color:#7c3aed;letter-spacing:1px;margin-bottom:5px;">🏗 現況・本復旧</div><div style="display:flex;flex-direction:column;gap:5px;">'+_honChips.join('')+'</div></div>'
              +'</div>')
            : ('<div style="display:flex;flex-wrap:wrap;gap:6px;">'+_kariChips.join('')+'</div>'))
          +'<div style="font-size:13px;color:#0369a1;margin-top:6px;">合計H = '+Math.round(rb.totalH*1000)+'mm　※転圧ポイントはこの構成から自動計算</div>'
        +'</div>'
        +'</div>';
    }
  }

  // 進捗
  html += '<div class="progress-wrap">' +
    '<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>' +
    '<div class="progress-text" id="progText"></div>' +
  '</div>';

  if(!_typeKey){
    html += '<div style="text-align:center;color:var(--text3);padding:20px;font-size:17px;">型を選択するとチェックリストが表示されます</div>';
  } else {
    // マルチ箇所: 全箇所データをロードして凡例バー表示
    loadAllLocData();
    // 単一箇所モード: loadAllLocData後にkbnを再反映（ページリロード後に_locDataが空だった場合の対応）
    if (_locData.length === 1 && _locData[0] && _locData[0].kbn) {
      _kojiKbn = _locData[0].kbn;
      _kussuri_kbn = _locData[0].kbn;
    }
    if(_locData.length >= 2){
      html += renderLocLegendHTML();
    }
    var _effSections = getEffectiveSections(ck, _typeKey);
    if(_effSections.length===0){
      html += '<div style="text-align:center;color:var(--text3);padding:20px;font-size:17px;">チェックリスト未設定です</div>';
    } else {
      _effSections.forEach(function(sec, si){
        html += renderSection(sec, si);
      });
    }
  }

  html += '</main>';
  document.getElementById('checkMain').innerHTML = html;

  // 状態復元（ここでloadHata→imgBtn操作が走る）
  _hataEntry = null; // 一旦クリアしてloadHataで再セット
  restoreState();

  // 日付は常に今日に設定（restoreState で古い日付が入る場合があるため後から上書き）
  var dateEl = document.getElementById('inDate');
  var _today = new Date().toISOString().slice(0,10);
  if(dateEl) dateEl.value = _today;

  // ── 記録者デバイス記憶 ──────────────────────────────────
  var _recEl = document.getElementById('inRecorder');
  var _savedRec = localStorage.getItem('checklist_recorder') || '';
  if(_recEl) {
    var _stateRec = (_recEl.value || '').trim();
    if(!_stateRec && _savedRec) {
      // 状態に名前がなければデバイス記憶から補完
      _recEl.value = _savedRec;
    } else if(_stateRec && _savedRec && _stateRec !== _savedRec) {
      // 状態の名前とデバイス記憶が異なる場合に確認アラート
      var _useDevice = confirm(
        '⚠ 記録者の確認\n\n' +
        'このデバイスの登録者: 【' + _savedRec + '】\n' +
        '前回のセッションの記録者: 【' + _stateRec + '】\n\n' +
        '「OK」→ デバイス登録者（' + _savedRec + '）を使用\n' +
        '「キャンセル」→ 前回の記録者（' + _stateRec + '）を維持'
      );
      if(_useDevice) _recEl.value = _savedRec;
    } else if(!_stateRec && !_savedRec) {
      // どちらもなければ空のまま（入力を促す）
    }
  }
  // ──────────────────────────────────────────────────────
  // ウィザード自動表示: 旗揚げ番号未入力 かつ チェックなし かつ 箇所リストなし の場合
  (function(){
    if (!_siteId || !_typeKey || _wiz.active) return;
    var hataVal = ($v('hataInput')||'').trim();
    var hasChecks = Object.keys(_checks||{}).some(function(k){ return _checks[k]; });
    var hasLocList = _locList && _locList.some(function(h){ return h; });
    if (!hataVal && !hasChecks && !hasLocList) {
      setTimeout(function(){ if(!_wiz.active) showWizard(); }, 400);
    }
  })();
  // ──────────────────────────────────────────────────────
  // Firestore管種設定（管理者登録済みの場合はそちらを優先）
  // localStorage個人設定よりFirestore共通設定を優先して上書き
  loadPipeSettingsFromFb();
  // pipe2Wrap の初期表示制御（_pipeCountに基づく）
  var _p2w = document.getElementById('pipe2Wrap');
  var _aBtn = document.getElementById('addPipeBtn');
  if(_p2w) _p2w.style.display = _pipeCount >= 2 ? 'contents' : 'none';
  if(_aBtn) _aBtn.style.display = _pipeCount >= 2 ? 'none' : 'inline-block';
  recalcGL();
  updatePipeItems();
  updateDummyItems();
  updateProgress();
  renderLocTabs();
  _rebuildLocRbSelect(); // renderMainでlocRbSelectが再生成されるため選択値を復元
}

function renderSection(sec, si, isHon){
  // ロックセクション（ヘッダーのみ表示）
  if(sec._locked){
    return '<div class="checklist-section">'
      + '<div class="section-header locked-hdr">'
      + '<span class="stitle">'+sec.phase+'</span>'
      + '<span class="locked-note">本復旧モード中（非対象）</span>'
      + '</div></div>';
  }
  var _isBurial = sec._isHonBurial;
  var hdrCls = 'section-header open' + (isHon ? ' hon-hdr' : '') + (_isBurial ? ' hon-burial-hdr' : '');
  var html = '<div class="checklist-section">' +
    '<div class="' + hdrCls + '" onclick="toggleSection(this)">' +
    '<span class="stitle">'+(_isBurial?'🏗 ':(isHon?'🏗 ':''))+sec.phase+'</span>' +
    '<span class="sarrow">▾</span>' +
    '</div><div class="check-items">';

  // 混在型モード: タブで箇所を切替・チェックボックスは現在箇所のみ（シングル扱い）
  var _isMultiLoc = _locData.length >= 2 && !_isMixedCkType;
  // 混在型モード用: 現在箇所の checks/na を _checks/_naItems として参照
  var _mixChecks   = _isMixedCkType && _locData[_locIdx] ? _locData[_locIdx].checks   : _checks;
  var _mixNaItems  = _isMixedCkType && _locData[_locIdx] ? _locData[_locIdx].na        : _naItems;
  var _mixSubChecks= _isMixedCkType && _locData[_locIdx] ? _locData[_locIdx].subChecks : _subChecks;

  sec.items.forEach(function(item, ii){
    // 埋設シート敷設の直後の中間転圧は、深さ順インターリーブ表示のため埋設シート行に統合（個別行は省略）
    if(item.glType === 'midList' && ii>0 && sec.items[ii-1] && sec.items[ii-1].glType === 'sheet'){
      return;
    }
    var k = item._k || itemKey(si,ii);
    // マルチ箇所モード: 全箇所の状態から isDone / isNA を判定
    var isDone, isNA;
    if(_isMultiLoc){
      // _locMaskがある場合はマスクされた箇所を除外（マスク箇所の古いデータで誤判定しない）
      isDone = _locData.some(function(d,li){ if(item._locMask&&item._locMask[li]===false)return false; return !!d.checks[k]; });
      isNA   = _locData.every(function(d,li){ if(item._locMask&&item._locMask[li]===false)return true; return !!d.na[k]; });
    } else if (_isMixedCkType) {
      // 混在型モード: 現在箇所の状態のみ参照
      isDone = !!_mixChecks[k];
      isNA   = !!_mixNaItems[k];
    } else {
      isDone = !!_checks[k];
      isNA   = !!_naItems[k];
    }
    var cls = 'check-item' + (isDone?' checked':'') + (isNA?' na':'');

    var tags = '';
    var gt = item.glType || '';
    // 埋設シート敷設の直後に中間転圧が続く場合は1行に統合表示（深さ順インターリーブ）
    var _comboPair = (gt === 'sheet' && sec.items[ii+1] && sec.items[ii+1].glType === 'midList');

    if(gt === 'mizu'){
      tags = '<div class="tags"><div class="tag-mizu" data-item-k="'+k+'"></div></div>';
    } else if(_comboPair){
      var _midNote = (sec.items[ii+1].note||'').replace(/"/g,'&quot;');
      tags = '<div class="tags combo-wrap" data-si="'+si+'" data-ii="'+ii+'" data-mid-note="'+_midNote+'"><span class="tag tag-yellow">DP入力後に順序を計算</span></div>';
    } else if(gt === 'sheet'){
      tags = '<div class="tags"><span class="tag-sheet"><span class="tag tag-blue">①通信 DP入力後に計算</span></span></div>';
    } else if(gt === 'midList'){
      tags = '<div class="tags mid-list-wrap"><span class="tag tag-yellow">DP入力後にGL値・繰り返し回数を計算</span></div>';
    } else if(gt === 'roadbedChg'){
      tags = '<div class="tags"><span class="tag tag-yellow tag-roadbedchg">' + (item.dim||'GL-??') + '</span></div>';
    } else if(gt === 'paveThick'){
      tags = '<div class="tags"><div class="pave-thick-wrap" data-kari="'+(item._paveKariH||0).toFixed(3)+'" data-hon="'+(item._paveHonH||0).toFixed(3)+'"></div></div>';
    } else {
      if(item.gl===1) tags += '<div class="gl1-dp-wrap" data-item-k="'+k+'"></div>';
      if(item.gl===2) tags += '<span class="gl2-dp-wrap"><span class="tag tag-green">'+glTagStr(2)+'</span></span>';
      if(item.gl==='mid') tags += '<div class="bh-wrap" data-item-k="'+k+'"></div>';
      if(gt==='yuka') tags += '<div class="yuka-wrap" data-item-k="'+k+'"></div>';
      // 路盤転圧: 多箇所モードで個別行（expand）スタイル
      // 表示形式: [No.X バッジ] [路盤種別名] [GL dim] ← 中間転圧/埋設シートと同形式
      if(item._rbExpanded && _isMultiLoc){
        var _rbExpTagSty=[
          'background:#fffbeb;border:1px solid #f59e0b;color:#92400e;',
          'background:#f0f9ff;border:1px solid #0ea5e9;color:#0369a1;',
          'background:#f0fdf4;border:1px solid #22c55e;color:#15803d;'
        ];
        // 路盤種別名: 仮復旧→「仮」chip、本復旧→「本」chip（撮影項目名はcnameで表示）
        var _isHonRbItem = (item.n || '').indexOf('本復旧') === 0;
        var _rbKindLabel = _isHonRbItem ? '本' : '仮';
        var _rbKindCls = 'combo-kind combo-kind-rb-' + (_isHonRbItem ? 'hon' : 'kari');
        var _rbExpEntries=[];
        _locData.forEach(function(ld,li){

        if(_rbExpEntries.length>0){

          });

      }
      if(tags) tags = '<div class="tags">'+tags+'</div>';
    }

    // note：glTypeごとに専用クラス付与（動的更新のためdata-base-note属性も設定）
    var noteClass = gt==='sheet' ? 'cnote note-sheet' :
                    gt==='roadbedChg' ? 'cnote note-roadbedchg' : 'cnote';

    var noteHtml = item.note

    // 管種スロット検出
    var _pipeSlot = 0;

    var _guideN = _comboPair ? '埋設シート敷設' : item.n;
    var _hasGuide = !!_findGuide(_guideN);

    // 路盤構成ラベル注釈（転圧項目の上に構成名を表示）
    var _rbLabelNotes = '';
    if (item._rbStepType) {

      if (_isMultiLoc && !item._rbExpanded) {
        // 多箇所モード: 旗揚げ番号を色付きバッジで表示（水締め・掘削出来形と同形式）

        if(_g2p.length) _gl1Notes='<div style="font-size:12px;color:#555;margin-top:2px">'+_g2p.join('　')+'</div>';
      }
      // ④ 路盤転圧ステップ注釈: 各箇所のGL値を表示（箇所別路盤構成が異なる場合に有効）
      // _rbExpandedアイテムは既にGL値別に分割済みのため注釈不要
      var _rbStepNotes='';
      if(item._rbStepType && _locRbData.length>=2 && !item._rbExpanded){
        var _rbParts=[];
        _locData.forEach(function(ld,li){
          var lrd=_locRbData[li];
          if(!lrd){_rbParts.push(['①','②','③'][li]+'—');return;}
          var arr=item._rbStepType==='kariRc'?lrd.rcLayers:
                  item._rbStepType==='kariRm'?lrd.rmLayers:
                  item._rbStepType==='honRc'?lrd.honRcLayers:
                  item._rbStepType==='honRm'?lrd.honRmLayers:[];
          var step=arr[item._rbStepIdx||0];
          _rbParts.push(['①','②','③'][li]+(step?step.dim:'—'));
        });

      // 掘削出来形・土被り・水締め・埋設シート+中間転圧: メインN-chkを非表示にし個別行を左列に表示
      var _isExpandItem = (gt==='mizu' || gt==='yuka' || _comboPair || (item.gl===1 && !item.gl2) || (item._rbExpanded && _isMultiLoc));
      // expand時: cname/cdimを通常アイテムのテキスト開始位置に揃えるためpadding-leftを付与
      // chk-loc 28px × N + gap 2px × (N-1) + check-item gap 10px
      var _expPL = _isExpandItem ? (_locData.length*28 + (_locData.length-1)*2 + 10) + 'px' : '0';
      // 箇所番号バッジ（①NO.35 / ②NO.37 形式・箇所色）をcname上に表示
      // expand items: 全箇所表示 / locMask有り items: 該当箇所のみ表示（3箇所全同一は省略）
      var _locNumLabel = '';
      if (_isMultiLoc && (_isExpandItem || item._locMask)) {
        var _lnBgColors = ['#f59e0b','#0ea5e9','#22c55e'];
        var _lnPL = _isExpandItem ? _expPL : '0px';
        var _lnTags = '';
        _locData.forEach(function(ld, li) {
          // locMask有り items はアクティブloc（mask=trueまたはmask未設定）のみ表示
          if (item._locMask && item._locMask[li] === false) return;

          var hNum = (_locList && _locList[li]) ? pfx+'NO.'+_locList[li] : pfx;

          _lnTags += '<span style="background:'+bg+';color:#fff;border-radius:4px;font-size:12px;font-weight:700;padding:1px 7px;display:inline-block;">'+hNum+'</span>';
        });
        if (_lnTags) _locNumLabel = '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px;padding-left:'+_lnPL+'">'+_lnTags+'</div>';
      }
      // kbnInfoRow: _locMask && !_rbExpanded items に仮/本バッジ表示（表示のみ・チェックボックスなし）
      var _kbnInfoRow = '';
      if (!item._rbExpanded && item._locMask && _isMultiLoc) {
        var _kirStyle = [
          'background:#fffbeb;border:1px solid #f59e0b;color:#92400e;',
          'background:#f0f9ff;border:1px solid #0ea5e9;color:#0369a1;',
          'background:#f0fdf4;border:1px solid #22c55e;color:#15803d;'
        ];
        var _kirTags = '';
        _locData.forEach(function(ld, li) {
          if (item._locMask && item._locMask[li] === false) return;
          var _isHon = (ld.kbn || 'kari') === 'hon';
          var _kbnCls = 'combo-kind combo-kind-rb-' + (_isHon ? 'hon' : 'kari');
          var _kbnLabel = _isHon ? '本' : '仮';
          var _ksty = _kirStyle[Math.min(li, 2)];
          var _dchip = item.dim ? '<span class="tag" style="'+_ksty+'font-size:13px;padding:2px 6px;">'+item.dim+'</span>' : '';
          _kirTags += _noLocTag(li) + '<span class="' + _kbnCls + '" style="font-size:13px;padding:2px 6px;">' + _kbnLabel + '</span>' + _dchip;
        });
        if (_kirTags) _kbnInfoRow = '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;">' + _kirTags + '</div>';
      }
      html += '<div class="'+cls+'"'+_combinedStyle+' data-k="'+k+'"'+_pipeSlotAttr+_dummyAttr+_cutterAttr+_odawaraAttr+'>' +
        (_hasGuide?'<button class="btn-guide"'+_guideAttr+' onclick="showPhotoGuide(event,this.dataset.gn)" title="撮影ガイド">ℹ️</button>':'<span class="btn-guide-spacer"></span>') +
        (_isExpandItem ? '' : _locBoxes) +
        '<div class="check-label">' +
          _locNumLabel +
          _rbLabelNotes +
          '<div class="cname"'+(_isExpandItem?' style="padding-left:'+_expPL+'"':'')+'>'+(_comboPair ? '埋設シート・中間転圧' : ((item._rbExpanded || item._locMask) ? (item.n||'').replace(/^(?:仮復旧工|本復旧工|仮復旧|本復旧)[　 ]+/,'') : item.n))+'</div>' +
          _kbnInfoRow +
          (item.dim && !item._rbExpanded && !item._locMask ? '<div class="cdim"'+(_isExpandItem?' style="padding-left:'+_expPL+'"':'')+'>'+item.dim+'</div>':'') +
          tags + ((_isExpandItem && item._rbExpanded && noteHtml) ? noteHtml.replace(/^<div /,'<div style="padding-left:'+_expPL+'" ') : noteHtml) + (_isExpandItem ? '' : _sheetNotes) + (_isExpandItem ? '' : _gl1Notes) + _rbStepNotes +
          (_comboPair ? '<div class="combo-mid-note"></div>' : '') +
        '</div>' +
      '</div>';
    } else {
      // ── シングル箇所モード（従来） ───────────────────────────────
      // 本復旧セクションのdim付きアイテム: 「本」バッジ + dimチップ表示
      // 路盤転圧に限らずdim（GL値・厚み）を持つ全項目に適用
      var _isHonRbChip = _isBurial && item.dim && !_comboPair;
      var _honRbChipHtml = '';
      var _honRbStyle = '';
      if (_isHonRbChip) {
        var _honCnameShort = (item.n||'').replace(/^(?:仮復旧工|本復旧工|仮復旧|本復旧)[　 ]+/, '');
        _honRbChipHtml = '<div class="combo-seq"><div class="combo-seq-row">'
          + '<span class="combo-kind combo-kind-rb-hon" style="font-size:13px;padding:2px 6px;">本</span>'
          + '<span class="tag" style="background:#fffbeb;border:1px solid #f59e0b;color:#92400e;font-size:13px;padding:2px 6px;">'+item.dim+'</span>'
          + '</div></div>';
        _honRbStyle = ' style="background:#fffbeb;"';
      }
      var _singleCombinedStyle = _isHidden ? ' style="display:none;"' : (_isHonRbChip ? _honRbStyle : (_singleLocBg ? ' style="background:'+_singleLocBg+';"' : ''));
      html += '<div class="'+cls+'"'+_singleCombinedStyle+' onclick="toggleCheck('+si+','+ii+')" data-k="'+k+'"'+_pipeSlotAttr+_dummyAttr+_cutterAttr+_odawaraAttr+'>' +
        (_hasGuide?'<button class="btn-guide"'+_guideAttr+' onclick="showPhotoGuide(event,this.dataset.gn)" title="撮影ガイド">ℹ️</button>':'<span class="btn-guide-spacer"></span>') +
        '<div class="check-box">'+(isNA?'－':(isDone?'✓':''))+'</div>' +
        '<div class="check-label">' +
          _rbLabelNotes +
          '<div class="cname">'+(_comboPair ? '埋設シート・中間転圧' : (_isHonRbChip ? _honCnameShort : item.n))+'</div>' +
          (!_isHonRbChip && item.dim && gt!=='roadbedChg' ? '<div class="cdim">'+item.dim+'</div>':'') +
          (_isHonRbChip ? _honRbChipHtml : tags) +
          noteHtml +
          (_comboPair ? '<div class="combo-mid-note"></div>' : '') +
        '</div>' +
        (item.na?'<button class="btn-na" onclick="toggleNA(event,'+si+','+ii+')">'+(isNA?'対象に戻す':'対象外')+'</button>':'') +
      '</div>';
    }
  });

  html += '</div></div>';
  return html;
}

function toggleSection(hdr){
  var items = hdr.nextElementSibling;
  var open = hdr.classList.contains('open');
  hdr.classList.toggle('open', !open);
  items.style.display = open ? 'none' : '';
}

function toggleCheck(si, ii){
  var k = itemKey(si,ii);
  // 混在型モード: 現在箇所のlocDataを直接更新
  if (_isMixedCkType && _locData[_locIdx]) {
    if (_locData[_locIdx].na[k]) return;
    _locData[_locIdx].checks[k] = !_locData[_locIdx].checks[k];
    _checks[k] = _locData[_locIdx].checks[k]; // グローバル同期
    var on = !!_locData[_locIdx].checks[k];
    var el = document.querySelector('[data-k="'+k+'"]');
    if(el){ el.classList.toggle('checked',on); var box=el.querySelector('.check-box');if(box)box.textContent=on?'✓':''; }
    saveLocDataState(_locIdx);
    updateProgress();
    return;
  }
  if(_naItems[k]) return; // 対象外はチェック不可
  _checks[k] = !_checks[k];
  var el = document.querySelector('[data-k="'+k+'"]');
  if(el){
    el.classList.toggle('checked', !!_checks[k]);
    el.querySelector('.check-box').textContent = _checks[k]?'✓':'';
  }
  updateProgress();
  saveState();
}

function toggleNA(e, si, ii){
  e.stopPropagation();
  var k = itemKey(si,ii);
  _naItems[k] = !_naItems[k];
  if(_naItems[k]) _checks[k] = false;
  // 混在型モード: locDataにも反映
  if (_isMixedCkType && _locData[_locIdx]) {
    _locData[_locIdx].na[k] = _naItems[k];
    if(_naItems[k]) _locData[_locIdx].checks[k] = false;
    saveLocDataState(_locIdx);
  }
  // 再描画（このセクションだけ）
  var ck = TYPE_CHECKLISTS[_typeKey];
  if(!ck) return;
  var secs = document.querySelectorAll('.checklist-section');
  // セクション全体再描画
  var container = document.querySelector('#checkMain');
  var sectionsHtml = '';
  getEffectiveSections(ck, _typeKey).forEach(function(sec,s){ sectionsHtml += renderSection(sec,s); });
  // 既存セクションを置き換え
  var tmpDiv = document.createElement('div');
  tmpDiv.innerHTML = sectionsHtml;
  var newSecs = tmpDiv.querySelectorAll('.checklist-section');
  secs.forEach(function(old,i){ if(newSecs[i]) old.parentNode.replaceChild(newSecs[i],old); });
  updateProgress();
  saveState();
}

// 個別DP用サブチェック（例：□DP①通信管DP=00m □DP②通信管DP=00m）
// 撮影済みかどうかを個別に記録・保存できるチェックボックス
function subChkSpan(key, innerHtml){
  var on = !!_subChecks[key];
  return '<span class="subchk-item'+(on?' on':'')+'" data-subchk-key="'+key+'" onclick="toggleSubChk(event,this)">'
       + '<span class="subchk-box">'+(on?'✓':'')+'</span>'
       + innerHtml
       + '</span>';
}
function toggleSubChk(e, el){
  e.stopPropagation();
  if(!el) return;
  var key = el.getAttribute('data-subchk-key');
  if(!key) return;
  _subChecks[key] = !_subChecks[key];
  el.classList.toggle('on', !!_subChecks[key]);
  var box = el.querySelector('.subchk-box');
  if(box) box.textContent = _subChecks[key] ? '✓' : '';
  saveState();
}

// 管下H 計算補助
// =====================================================
function calcDPH(pipe){
  var p1id = pipe===1 ? 'dphPipe1' : 'dphPipe3';
  var b1id = pipe===1 ? 'dphBase1' : 'dphBase2';
  var p2id = pipe===1 ? 'dphPipe2' : 'dphPipe4';
  var resId = pipe===1 ? 'dphResult1' : 'dphResult2';
  var dphId = pipe===1 ? 'inDPH' : 'inDPH2';

  var p1 = parseFloat($v(p1id)) || 0;
  var b1 = parseFloat($v(b1id)) || 0;
  var p2 = parseFloat($v(p2id)) || 0;

  var resEl = document.getElementById(resId);
  var dphEl = document.getElementById(dphId);
  if(!p1){ if(resEl) resEl.textContent=''; return; }

  var total = p1 + b1 + p2; // mm
  var totalM = (total / 1000).toFixed(3);

  var expr = p1 + (b1 ? '＋管台' + b1 : '') + (p2 ? '＋' + p2 : '') + ' ＝ ' + total + 'mm ＝ ' + totalM + 'm';
  if(resEl) resEl.innerHTML = '管下H：' + expr +
    ' <button onclick="applyDPH(' + pipe + ',' + totalM + ')" style="margin-left:8px;padding:2px 10px;font-size:14px;background:#0ea5e9;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:700;">①管下Hにセット</button>';
}

function applyDPH(pipe, val){
  var id = pipe===1 ? 'inDPH' : 'inDPH2';
  var el = document.getElementById(id);
  if(el){ el.value = val; recalcGL(); }
  // ボタンラベルを「セット済」に変更
  var resId = pipe===1 ? 'dphResult1' : 'dphResult2';
  var resEl = document.getElementById(resId);
  if(resEl){
    var btns = resEl.querySelectorAll('button');
    btns.forEach(function(b){ b.textContent='✓ セット済'; b.style.background='#059669'; });
  }
}



// 管種名（スロット番号①②なし）を返す
function getPipeBaseName(idx){
  var rawType = (_pipeTypes && _pipeTypes[idx]!=null) ? _pipeTypes[idx] : '';
  if(!rawType) return idx===0?'通信管':idx===1?'電力管':'管'+(idx+1);
  if(rawType==='その他') return (_pipeCustomNames[idx]||'').trim()||'その他';
  return rawType;
}
// GL値フォーマット（例: -1.50 → "GL-1.50m"）
function fmtGL(v){ return 'GL-' + Math.abs(parseFloat(v)).toFixed(3) + 'm'; }
// 勾配 端部名（1=起点側 / 2=終点側）
function _endName(endNum){ return endNum===1 ? '起点' : endNum===2 ? '終点' : ''; }
// 管種ラベル（勾配時は「①起点 通信管」形式・勾配なしは「①通信管」）
function getPipeLblEnd(idx, endNum){
  var nums = ['①','②','③','④'];
  var e = _endName(endNum);
  return (nums[idx] || (idx+1)+'') + (e ? e+' ' : '') + getPipeBaseName(idx);
}
// 勾配 起点/終点用ラベル生成（①起点 通信管 GL-Xm 形式）
function glGradLbl(pipeIdx, endNum, v){
  var lbl = getPipeLblEnd(pipeIdx, endNum);
  return v!=='' ? lbl+' '+fmtGL(v) : lbl+' DP入力後に計算';
}

// 中間転圧GLリスト生成（start自体を含み、limit未満まで@200）
function midList(start, limit, max){
  max = max || 8;
  if(start === '' || start === null) return [];
  var r = [], cur = start;
  for(var i = 0; i < max; i++){
    if(cur >= limit) break;
    r.push(cur);
    cur = parseFloat((cur + 0.2).toFixed(4));
  }
  return r;
}

// 型ごとの埋設シートmm（車道=300、歩道=200）
var EMBED_MM = {'85':300,'40':300,'30':200,'20':200,'14':200};
// 型ごとの路盤構成変更点 GL値（負の値）
var ROADBED_GL = {'85':-0.85,'40':-0.40,'30':-0.30,'20':-0.20,'14':-0.14};

// ─── 管種セレクタ ヘルパー ───────────────────────────────────────────
var PIPE_OPTIONS = ['通信管', '電力管', 'ガス管', '水道管', '下水管', 'その他'];

function getPipeLbl(idx) {
  var nums = ['①', '②', '③'];
  var t = _pipeTypes[idx] !== undefined ? _pipeTypes[idx] : '';
  // 「その他」の場合はカスタム名を優先
  if (t === 'その他') {
    var custom = (_pipeCustomNames[idx] || '').trim();
    t = custom || 'その他';
  }
  return (nums[idx] || (idx+1)+'') + (t ? t : '');
}

function setPipeType(idx, val) {
  _pipeTypes[idx] = val;
  // 「その他」フリー入力欄の表示切替
  var customWrap = document.getElementById('pipeCustomWrap'+idx);
  if (customWrap) customWrap.style.display = (val === 'その他') ? '' : 'none';
  if (val !== 'その他') _pipeCustomNames[idx] = ''; // リセット
  _refreshPipeLabels(idx);
  updatePipeItems();
  recalcGL();
}

function setPipeCustomName(idx, val) {
  _pipeCustomNames[idx] = val;
  _refreshPipeLabels(idx);
  updatePipeItems();
  recalcGL();
}

function _refreshPipeLabels(idx) {
  var prefix = getPipeLbl(idx);
  var lpDP  = document.getElementById('lblDP'+(idx+1));
  var lpDPH = document.getElementById('lblDPH'+(idx+1));
  if (lpDP)  lpDP.textContent  = prefix + ' DP (m)';
  if (lpDPH) lpDPH.textContent = prefix + ' 管下H (m)';
  var dphHdr = document.getElementById('dphHdr'+(idx+1));
  if (dphHdr) dphHdr.textContent = prefix + (idx===0?'':'（異なる場合のみ）');
}

function addPipeRow() {
  if(_pipeCount>=4) return;
  _pipeCount++;
  var wId = 'pipe'+_pipeCount+'Wrap';
  var w = document.getElementById(wId);
  if(w) w.style.display = 'contents';
  var btn = document.getElementById('addPipeBtn');
  if(btn) btn.style.display = _pipeCount>=4 ? 'none' : 'inline-block';
  updatePipeItems();
  recalcGL(); saveState();
}

function removePipeRow() {
  if(_pipeCount<=1) return;
  var idx = _pipeCount - 1;
  var dpId  = idx===1 ? 'inDP2'  : 'inDP'+(idx+1);
  var dphId = idx===1 ? 'inDPH2' : 'inDPH'+(idx+1);
  var dpsId = idx===1 ? 'inDP2s' : 'inDP'+(idx+1)+'s';
  var dphsId= idx===1 ? 'inDPH2s': 'inDPH'+(idx+1)+'s';
  [dpId,dphId,dpsId,dphsId].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
  _pipeGradient[idx] = false;
  var sf = document.getElementById('slopeFields'+idx); if(sf) sf.style.display='none';
  var ck = document.getElementById('chkGrad'+idx); if(ck) ck.checked=false;
  var wId = 'pipe'+_pipeCount+'Wrap';
  var w = document.getElementById(wId); if(w) w.style.display='none';
  _pipeCount--;
  var btn = document.getElementById('addPipeBtn');
  if(btn) btn.style.display = 'inline-block';
  updatePipeItems();
  recalcGL(); saveState();
}

function makePipeSelect(idx) {
  var cur = (_pipeTypes[idx] !== undefined && _pipeTypes[idx] !== null) ? _pipeTypes[idx] : (idx===0?'通信管':'電力管');
  var customVal = _pipeCustomNames[idx] || '';
  var isOther = cur === 'その他';
  var s = '<select onchange="setPipeType('+idx+',this.value)"'
    + ' style="width:100%;padding:4px 4px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;background:var(--surface);color:var(--text1);height:34px;box-sizing:border-box;">';
  s += '<option value=""'+(cur===''?' selected':'')+'>（管種なし）</option>';
  PIPE_OPTIONS.forEach(function(o){
    s += '<option value="'+o+'"'+(cur===o?' selected':'')+'>'+o+'</option>';
  });
  s += '</select>';
  // 「その他」フリー入力欄（常にDOMに存在、表示のみ切替）
  s += '<div id="pipeCustomWrap'+idx+'" style="display:'+(isOther?'':'none')+';margin-top:3px;">'
    +  '<input type="text" id="pipeCustom'+idx+'" placeholder="管種名を入力" value="'+customVal.replace(/"/g,'&quot;')+'"'
    +  ' oninput="setPipeCustomName('+idx+',this.value)"'
    +  ' style="width:100%;box-sizing:border-box;padding:4px 6px;border:1.5px solid #fbbf24;border-radius:5px;font-size:14px;background:#fffbeb;">'
    +  '</div>';
  return s;
}

function toggleGradient(idx, checked) {
  _pipeGradient[idx] = checked;
  var slopeEl = document.getElementById('slopeFields' + idx);
  if (slopeEl) slopeEl.style.display = checked ? '' : 'none';
  // ラベル更新（①端表記の追加/除去）
  var lblDP  = document.getElementById('lblDP'  + (idx+1));
  var lblDPH = document.getElementById('lblDPH' + (idx+1));
  var lbl    = getPipeLbl(idx);
  if(lblDP)  lblDP.textContent  = lbl + (checked ? '（起点側）' : '') + ' DP (m)';
  if(lblDPH) lblDPH.textContent = lbl + (checked ? '（起点側）' : '') + ' 管下H (m)';
  if (!checked) {
    var dpsId  = idx===0 ? 'inDP1s'  : idx===1 ? 'inDP2s'  : 'inDP' +(idx+1)+'s';
    var dphsId = idx===0 ? 'inDPH1s' : idx===1 ? 'inDPH2s' : 'inDPH'+(idx+1)+'s';
    var dpEl  = document.getElementById(dpsId);
    var dphEl = document.getElementById(dphsId);
    if(dpEl)  dpEl.value  = '';
    if(dphEl) dphEl.value = '';
  }
  recalcGL();
  saveState();
}

function saveDpDphToMaster(){
  if(!_isAdmin){ alert('管理者のみDP/管下Hを保存できます'); return; }
  var num = $v('hataInput').trim();
  if(!num){ alert('旗揚げ番号が未入力です'); return; }
  var dp  = parseFloat($v('inDP1'));
  var dph = parseFloat($v('inDPH'));
  if(!dp || !dph){ alert('DP と 管下H を入力してください'); return; }

  // localStorage を更新
  var mkKey = _siteId ? 'hata_master_'+_siteId : 'hata_master';
  var arr = [];
  try{ arr = JSON.parse(localStorage.getItem(mkKey)||'[]'); }catch(e){}
  var idx = arr.findIndex(function(e){ return String(e.hata)===String(num); });
  if(idx < 0){ alert('No.'+num+' はマスタに見つかりません'); return; }

  arr[idx].dp   = dp;
  arr[idx].dph  = dph;
  // 勾配②端DP値も保存（入力があれば）
  var dp1sVal  = parseFloat($v('inDP1s'))  || null;
  var dph1sVal = parseFloat($v('inDPH1s')) || null;
  if(dp1sVal  !== null) arr[idx].dp1s  = dp1sVal;

var _gl3='', _gl4='';
function glTagStr(pipe){
  var v = pipe===1?_gl1:pipe===2?_gl2:pipe===3?_gl3:_gl4;
  var lbl = getPipeLbl(pipe-1);
  return v ? lbl+' GL-'+v+'m' : lbl+' DP入力後に計算';
}
function fmtBH(){
  var dp1=parseFloat($v('inDP1'))||0, dp2=parseFloat($v('inDP2'))||0;
  var dph1=parseFloat($v('inDPH'))||0, dph2=parseFloat($v('inDPH2'))||0;
  // ★ 勾配あり: 終点側の床付けも候補に入れる（終点が深いケースを取りこぼさない）
  var dp1s  = _pipeGradient[0] ? (parseFloat($v('inDP1s'))  || 0) : 0;
  var dph1s = _pipeGradient[0] ? (parseFloat($v('inDPH1s')) || 0) : 0;
  var dp2s  = _pipeGradient[1] ? (parseFloat($v('inDP2s'))  || 0) : 0;
  var dph2s = _pipeGradient[1] ? (parseFloat($v('inDPH2s')) || 0) : 0;
  var bh=parseFloat($v('inBH'))||0.5, ext=parseFloat($v('inExtra'))||0;
  // 床付けの最も深い値を基準にBH掘削GL算出
  var yuka1  = dp1  > 0 ? dp1  + dph1 : 0;
  var yuka1s = dp1s > 0 ? dp1s + (dph1s > 0 ? dph1s : dph1) : 0;
  var yuka2  = dp2  > 0 ? dp2  + dph2 : 0;
  var yuka2s = dp2s > 0 ? dp2s + (dph2s > 0 ? dph2s : dph2) : 0;
  var md=Math.max(yuka1, yuka1s, yuka2, yuka2s);
  return md>0?(md+bh+ext).toFixed(3):'??';
}

function updatePipeItems() {
  document.querySelectorAll('[data-pipe-slot]').forEach(function(el) {

    var idx  = slot - 1;
    var origN = el.getAttribute('data-orig-n') || '';
    var origType = _PIPE_SLOT_ORIG[idx] || '';

    // ── 表示制御 ──

    if (slot >= 2 && _pipeCount < 2) { el.style.display = 'none'; return; }
    el.style.display = '';

    // ── 管種名の解決（「その他」はカスタム名を使用） ──
    var rawType = (_pipeTypes[idx] !== undefined && _pipeTypes[idx] !== null)
      ? _pipeTypes[idx] : origType;
    var curType = (rawType === 'その他')
      ? ((_pipeCustomNames[idx] || '').trim() || 'その他')
      : rawType;

    // 項目名を現在の管種に変換
    var cname = el.querySelector('.cname');
    if (cname && origN) {
      var newN = curType
        ? origN.replace(origType, curType)
        : origN.replace(origType + '\u3000', '').replace(origType + ' ', '');
      cname.textContent = newN;

function updateProgress(){
  var _presetType2 = getPresetTypeData(_siteId, _typeKey, _presetTypeKey);
  var _dynCk2 = _presetType2 ? buildChecklistFromPreset(_presetType2) : null;
  var ck = _dynCk2 || TYPE_CHECKLISTS[_typeKey];
  if(!ck){ document.getElementById('progText')&&(document.getElementById('progText').textContent=''); return; }
  var pf = document.getElementById('progFill');
  var pt = document.getElementById('progText');
  var btn = document.getElementById('btnSave');

  if(_locData.length >= 2){
    // マルチ箇所: 箇所ごとの進捗を集計して表示
    var _upSections = getEffectiveSections(ck, _typeKey);
    var _totalItems=0;
    var _keys=[];
    _upSections.forEach(function(sec,si){
      if(sec._locked) return;
      sec.items.forEach(function(item,ii){
        if(item.glType==='midList'&&ii>0&&sec.items[ii-1]&&sec.items[ii-1].glType==='sheet') return;
        _keys.push(itemKey(si,ii));
        _totalItems++;
      });
    });
    var _locSummaries=[];
    var _totalDone=0, _totalPossible=0;
    _locData.forEach(function(ld,li){
      var d=0,t=0;
      _keys.forEach(function(k){
        if(ld.na[k]) return;
        t++;
        if(ld.checks[k]) d++;
      });
      _totalDone+=d; _totalPossible+=t;
      _locSummaries.push((['①','②','③'][li]||li+1)+' '+d+'/'+t);
    });
    var pct=_totalPossible>0?Math.round(_totalDone/_totalPossible*100):0;
    if(pf) pf.style.width=pct+'%';
    if(pt) pt.textContent=_locSummaries.join('　')+' （'+pct+'%）';
    var allDone=_totalDone===_totalPossible&&_totalPossible>0;
    if(btn){ btn.classList.toggle('all-done',allDone); btn.textContent=allDone?'🎉 全完了！記録を保存':'💾 記録を保存'; }
  } else {
    // シングル箇所（従来）
    var total=0,done=0;
    var _upSections2 = getEffectiveSections(ck, _typeKey);
    _upSections2.forEach(function(sec,si){
      if(sec._locked) return;
      sec.items.forEach(function(item,ii){
        if(item.glType === 'midList' && ii>0 && sec.items[ii-1] && sec.items[ii-1].glType === 'sheet') return;
        var k=itemKey(si,ii);
        if(_naItems[k]) return;
        total++;
        if(_checks[k]) done++;
      });
    });
    var pct = total>0 ? Math.round(done/total*100) : 0;
    if(pf) pf.style.width=pct+'%';
    if(pt) pt.textContent = done+' / '+total+' 完了　（'+pct+'%）';
    var allDone2=done===total&&total>0;
    if(btn){ btn.classList.toggle('all-done',allDone2); btn.textContent=allDone2?'🎉 全完了！記録を保存':'💾 記録を保存'; }
  }
}

  }
  try{ var gr=localStorage.getItem('hata_master'); if(gr){var gp=JSON.parse(gr);if(Array.isArray(gp))items=items.concat(gp);} }catch(e){}
  // 重複除去（hata番号優先）
  var seen={};
  items=items.filter(function(e){ var k=String(e.hata||e.num||''); if(!k||seen[k])return false; seen[k]=true; return true; });
  // 数値ソート
  items.sort(function(a,b){ return (+(a.hata||a.num||0))-(+(b.hata||b.num||0)); });
  return items;
}

function showHataPopup(){
  _hataPopupItems=_buildHataPopupList();
  _hataPopupIdx=-1;
  filterHataPopup();
}

function filterHataPopup(){
  var popup=document.getElementById('hataPopup');
  if(!popup) return;
  var val=((document.getElementById('hataInput')||{}).value||'').trim();
  var filtered=_hataPopupItems.filter(function(e){
    var k=String(e.hata||e.num||'');
    return !val || k.indexOf(val)===0;
  });
  if(!filtered.length){
    popup.innerHTML='<div class="hata-popup-empty">該当なし</div>';
    popup.style.display=filtered.length===0&&val===''&&_hataPopupItems.length===0?'none':'block';
    if(_hataPopupItems.length===0) popup.style.display='none';
    return;
  }
  popup.innerHTML=filtered.map(function(e){
    var k=String(e.hata||e.num||'');
    var nm=e.name||'';
    var dpStr=e.dp!=null?' DP:'+e.dp+'m':'';
    var meta=(nm||dpStr)? (nm+dpStr) : '';
    return '<div class="hata-popup-item" data-hata="'+k+'" onmousedown="event.preventDefault();selectHataItem(this.dataset.hata)">'+
      '<span class="hata-popup-num">No.'+k+'</span>'+
      (meta?'<span class="hata-popup-meta">'+meta+'</span>':'')+
    '</div>';
  }).join('');
  popup.style.display='block';
  _hataPopupIdx=-1;
}

function selectHataItem(num){
  var el=document.getElementById('hataInput');
  if(el) el.value=num;
  closeHataPopup();
  loadHata();
}

function closeHataPopup(){
  var popup=document.getElementById('hataPopup');
  if(popup) popup.style.display='none';
}

function hataKeyNav(e){
  var popup=document.getElementById('hataPopup');
  if(!popup||popup.style.display==='none'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ showHataPopup(); e.preventDefault(); return; }
    if(e.key==='Enter'){ loadHata(); return; }
    return;
  }
  var items=popup.querySelectorAll('.hata-popup-item');
  if(!items.length){ if(e.key==='Enter'){closeHataPopup();loadHata();} if(e.key==='Escape')closeHataPopup(); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); _hataPopupIdx=Math.min(_hataPopupIdx+1,items.length-1); _hataPopupHL(items); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _hataPopupIdx=Math.max(_hataPopupIdx-1,-1); _hataPopupHL(items); }
  else if(e.key==='Enter'){ e.preventDefault();
    if(_hataPopupIdx>=0&&items[_hataPopupIdx]) selectHataItem(items[_hataPopupIdx].dataset.hata);
    else{ closeHataPopup(); loadHata(); }
  }
  else if(e.key==='Escape'){ closeHataPopup(); }
}

function _hataPopupHL(items){
  items.forEach(function(el,i){
    el.classList.toggle('hpop-active',i===_hataPopupIdx);
    if(i===_hataPopupIdx) el.scrollIntoView({block:'nearest'});
  });
}

function loadHata(){
  var num = $v('hataInput').trim();
  if(!num) return;
  // 現場別 + グローバル を全結合して検索（breakで途中離脱しない）
  var _allHataEntries = [];
  // 現場別を優先して追加
  if(_siteId){
    try{ var _sr=localStorage.getItem('hata_master_'+_siteId); if(_sr){var _sp=JSON.parse(_sr);if(Array.isArray(_sp))_allHataEntries=_allHataEntries.concat(_sp);} }catch(e){}
  }
  // グローバルも追加（重複は hata番号で後から dedup）
  try{ var _gr=localStorage.getItem('hata_master'); if(_gr){var _gp=JSON.parse(_gr);if(Array.isArray(_gp))_allHataEntries=_allHataEntries.concat(_gp);} }catch(e){}
  var infoEl = document.getElementById('hataInfo');
  if(!_allHataEntries.length){ if(infoEl) infoEl.innerHTML='<span style="color:var(--yellow)">⚠ 旗揚げマスタ未登録（発注アプリで登録してください）</span>'; return; }
  // roadbed.html は num フィールド、order.html は hata フィールドを使用するため両対応
  var entry = _allHataEntries.find(function(e){ return String(e.hata||e.num||'')===String(num); });
  if(!entry){ if(infoEl) infoEl.innerHTML='<span style="color:var(--text3)">No.'+num+' は未登録</span>'; return; }
  _hataEntry = entry;
  var _dbBtn=document.getElementById('debugBtn'); if(_dbBtn)_dbBtn.style.display='';
  var _dpBtn=document.getElementById('saveDpBtn'); if(_dpBtn)_dpBtn.style.display=(_isAdmin?'':'none');
  // ① 主管（深側）DP/管下H: 新フォーマット(dp/dph) → roadbed.html形式(kanH) → rangeFrom(深側始点) → 旧形式(dp1)
  var _dp  = entry.dp  != null ? entry.dp  : (entry.dp1 != null ? entry.dp1 : (entry.rangeFrom != null ? entry.rangeFrom : null));
  var _dph = entry.dph != null ? entry.dph : (entry.kanH != null ? entry.kanH : (entry.dph1 != null ? entry.dph1 : null));
  sv('inDP1', _dp); sv('inDPH', _dph);
  // ② 2本目管のDP/管下H: entry.dp2 のみ有効
  // ※ rangeTo / dp_end は「勾配②端（浅側）DP」= 1本目管のもう一方の端であり2本目管ではない → 除外
  var dp2val  = entry.dp2 || '';
  var dph2val = entry.dp2 ? (entry.dph2 || '') : '';
  if(dp2val)  sv('inDP2', dp2val);
  if(dph2val) sv('inDPH2', dph2val);
  // 勾配②端（浅側）DP/管下H: 新フォーマット(dp1s/dph1s) → roadbed.html形式(rangeTo/dph2) → 旧形式(dp_end)
  // ※ rangeFrom は深側DPのため使用不可（上の inDP1 側で使用）
  var _dp1s  = entry.dp1s  != null ? entry.dp1s  : (entry.rangeTo  != null ? entry.rangeTo  : (entry.dp_end  != null ? entry.dp_end  : null));
  var _dph1s = entry.dph1s != null ? entry.dph1s : (entry.dph2     != null ? entry.dph2     : null);
  // 旗揚げマスタに勾配②端データがあればチェックなしでも自動でON
  if(_dp1s != null && !_pipeGradient[0]) {
    toggleGradient(0, true);
    var _gcb0 = document.getElementById('chkGrad0');
    if(_gcb0) _gcb0.checked = true;
  }
  if(_dp1s  != null) sv('inDP1s',  _dp1s);
  if(_dph1s != null) sv('inDPH1s', _dph1s);
  if(entry.dp2s != null && !_pipeGradient[1]) {
    toggleGradient(1, true);
    var _gcb1 = document.getElementById('chkGrad1');
    if(_gcb1) _gcb1.checked = true;
  }
  if(entry.dp2s  != null) sv('inDP2s',  entry.dp2s);
  if(entry.dph2s != null) sv('inDPH2s', entry.dph2s);
  var info = entry.name?entry.name+'　':'';
  info += '①DP:'+(_dp!=null?_dp+'m':'未登録')+' 管下H:'+(_dph!=null?_dph+'m':'未登録');
  if(dp2val) info += '　②DP:'+dp2val+'m 管下H:'+(dph2val||_dph)+'m';
  if(_dp1s != null) info += '　終点側DP:'+_dp1s+'m';
  if(infoEl) infoEl.innerHTML='<span style="color:#78350f">'+info+'</span>';
  // 図面: imgData(order.html形式) または img(roadbed.html形式) を統合してチェック
  var _rawImg = entry.imgData || entry.img || '';
  var hasImg = !!(_rawImg && (
    _rawImg.startsWith('data:image') ||
    _rawImg.startsWith('data:application/pdf')
  ));
  // img フィールドを imgData に正規化（表示を統一するため）
  if (!entry.imgData && entry.img) entry.imgData = entry.img;
  if (hasImg) {
    showDiagram(entry, true);
    recalcGL();
    saveState();
  } else if (entry.hasImg && _fbDb) {
    // imgData が別ドキュメントに保存されている場合、Firestore から取得
    var _imgKey = (_siteId ? 'hata_master_' + _siteId : 'hata_master_global') + '_img_' + num;
    _fbDb.collection('masters').doc(_imgKey).get()
      .then(function(imgDoc) {
        if (imgDoc.exists && imgDoc.data().imgData) {
          entry.imgData = imgDoc.data().imgData;
          // localStorageのエントリも更新してキャッシュ
          var mkLocal = _siteId ? 'hata_master_' + _siteId : 'hata_master';
          try {
            var localArr = JSON.parse(localStorage.getItem(mkLocal)||'[]');
            var idx = localArr.findIndex(function(r){ return String(r.hata||r.num||'')===String(num); });
            if (idx >= 0) { localArr[idx].imgData = entry.imgData; localStorage.setItem(mkLocal, JSON.stringify(localArr)); }
          } catch(e) {}
          showDiagram(entry, true);
        } else {
          showDiagram(entry, false);
        }
      }).catch(function() { showDiagram(entry, false); });
    recalcGL();
    saveState();
  } else {
    showDiagram(entry, false);
    recalcGL();
    saveState();
  }
  // マルチ箇所モード: 現在タブの旗揚げ番号を更新 + DP値を即時同期保存
  if(_locList.length>0){
    var _lh=($v('hataInput')||'').trim();
    if(_locList[_locIdx]!==_lh){
      _locList[_locIdx]=_lh;
      _saveLocList();
      renderLocTabs();
    }
  }
  // loadHata後は_locData[_locIdx].dp1がDOMと乖離しているためここで同期
  if(_locData.length>=2){ syncCurrentToLocData(); saveLocDataState(_locIdx); }
  _rebuildLocRbSelect();
}

function showDiagram(e, hasImg){
  var diag = document.getElementById('hataDiagram');
  if(!diag) return;
  var zCtrl = document.getElementById('ckDiagZoomCtrl');
  if(!hasImg){
    diag.className='hata-diagram';
    if(zCtrl) zCtrl.style.display='none';
    return;
  }
  // タイトル（hata||num 両対応）
  var title = document.getElementById('diagTitle');
  if(title) title.textContent = '📐 旗揚げ No.'+(e.hata||e.num||'')+(e.name?'  '+e.name:'');
  // 数値タグ
  var vals = document.getElementById('diagVals');
  if(vals){
    // dp/dph は undefined の場合があるためフォールバックチェーンで解決
    var _sdp  = e.dp  != null ? e.dp  : (e.dp1  != null ? e.dp1  : (e.rangeFrom != null ? e.rangeFrom : '—'));
    var _sdph = e.dph != null ? e.dph : (e.kanH  != null ? e.kanH  : (e.dph1 != null ? e.dph1 : null));
    // _locDataにDP値があれば最終フォールバック（ウィザード入力値を反映）
    if (_sdph == null && _locData[_locIdx]) _sdph = parseFloat(_locData[_locIdx].dph) || '—';
    if (_sdph == null) _sdph = '—';
    var v = '<span class="dval">① DP '+_sdp+'m</span>';
    v += '<span class="dval g">① 管下H '+_sdph+'m</span>';
    var dp2 = e.dp2||e.dp_end||'';
    if(dp2) v += '<span class="dval">② DP '+dp2+'m</span>';
    if(e.pipetype) v += '<span class="dval">'+e.pipetype+'</span>';
    if(e.note) v += '<span style="font-size:13px;color:#555;padding:3px 4px">'+e.note+'</span>';
    vals.innerHTML = v;
  }
  // 画像①（imgData=order.html形式 / img=roadbed.html形式 両対応）
  var imgSrc  = e.imgData || e.img  || '';
  var imgSrc2 = e.img2 || '';
  var wrap  = document.getElementById('diagImgWrap');
  var wrap2 = document.getElementById('diagImgWrap2');
  _ckDiagZoomLv=1.0; _ckDiagBaseW=0;

  function _renderImgPanel(el, src, idSuffix){
    if(!el) return;
    if(src && src.startsWith('data:image')){
      el.innerHTML = '<img class="diagram-img" id="ckDiagImg'+idSuffix+'" src="'+src+'" alt="図面" style="width:100%;">';
      var _imgEl = el.querySelector('img');
      if(_imgEl && !idSuffix) _imgEl.onload=function(){_ckDiagBaseW=_imgEl.naturalWidth||_imgEl.offsetWidth||600;};
    } else if(src && src.startsWith('data:application/pdf')){
      el.innerHTML = '<div class="diagram-noimg">📄 PDF図面</div>';
    } else {
      el.innerHTML = '';
    }
  }

  if(wrap){
    _renderImgPanel(wrap, imgSrc, '');
    if(imgSrc && imgSrc.startsWith('data:image')){
      if(zCtrl){ zCtrl.style.display='flex'; }
      var lbl=document.getElementById('ckDiagZoomLv'); if(lbl) lbl.textContent='100%';
    } else {
      if(zCtrl) zCtrl.style.display='none';
    }
  }
  if(wrap2){
    if(imgSrc2 && imgSrc2.startsWith('data:image')){
      _renderImgPanel(wrap2, imgSrc2, '2');
      wrap2.style.display='';
    } else {
      wrap2.innerHTML='';
      wrap2.style.display='none';
    }
  }
  diag.className = 'hata-diagram show';
  // 旗揚げエリアの下角を四角に
  var ha = document.querySelector('.hata-area');
  if(ha) ha.classList.add('diagram-open');
}

}

function saveRecord(){
  var date = $v('inDate');
  if(!date){ showWarningBanner('作業日を入力してください', 'inDate'); return; }
  var recorder = ($v('inRecorder')||'').trim();
  if(!recorder){ showWarningBanner('記録者（氏名）を入力してください', 'inRecorder'); return; }
  // 記録者名をデバイスに保存（次回起動時に自動入力）
  _saveRecorderName(recorder);
  var _doneCount = Object.keys(_checks).filter(function(k){ return _checks[k]; }).length;
  if(_doneCount === 0){
    if(!confirm('チェック済み項目が0件です。このまま保存しますか？')){ return; }
  }
  var ck = TYPE_CHECKLISTS[_typeKey];
  var total=0, done=0;
  if(ck){
    var recSecs = getEffectiveSections(ck, _typeKey);
    recSecs.forEach(function(sec,si){ if(sec._locked) return; sec.items.forEach(function(item,ii){ if(item.glType==='midList'&&ii>0&&sec.items[ii-1]&&sec.items[ii-1].glType==='sheet') return; var k=itemKey(si,ii); if(!_naItems[k]){total++;if(_checks[k])done++;} }); });
  }

  var siteName=''; var typeName='';
  var site = _sites.find(function(s){return s.id===_siteId;});
  if(site) siteName=site.name;
  var selType = document.getElementById('selType');
  if(selType&&selType.selectedIndex>0) typeName=selType.options[selType.selectedIndex].text;

  _history.unshift({
    id:Date.now(), date:date, siteName:siteName, siteId:_siteId,
    typeName:typeName, typeKey:_typeKey,
    company:_myCompany||'', team:_myTeam||'',
    mgmt:$v('inMgmtNo'), recorder:$v('inRecorder'), hata:$v('hataInput'),
    done:done, total:total,
    checks:JSON.parse(JSON.stringify(_checks)),
    na:JSON.parse(JSON.stringify(_naItems))
  });
  if(_history.length>200) _history.pop();
  saveHistory();
  if(_history.length > 0) fbSaveRecord('cl_records', _history[0]);
  alert('✅ 保存しました（'+done+'/'+total+' 完了）');
}

function ilTypeMatch(types, filter){
  if(filter==='all') return true;
  if(types==='all') return true;
  return types.indexOf(filter)>=0;
}

function ilFilter(f){
  IL_FILTER = f;
  var btnIds = {
    'all':'il-btn-all', '車道乗入れ40型':'il-btn-40', '車道85型':'il-btn-85',
    '歩道乗入れ30型':'il-btn-30', '歩道乗入れ20型':'il-btn-20', '歩道14型':'il-btn-14'
  };
  Object.keys(btnIds).forEach(function(k){
    var b = document.getElementById(btnIds[k]);
    if(b) b.className = 'il-btn' + (k===f ? ' active' : '');
  });
  ilRender();
}

function ilRender(){
  var c = document.getElementById('il-list');
  if(!c) return;
  c.innerHTML = '';
  var no = 0;
  IL_ITEMS.forEach(function(d){
    if(d.phase){
      var ph = document.createElement('div');
      ph.style.cssText = 'padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:16px;font-weight:700;';
      ph.style.background = d.color; ph.style.color = d.fontColor;
      ph.textContent = d.phase;
      c.appendChild(ph);
      return;
    }
    if(!ilTypeMatch(d.types, IL_FILTER)) return;
    no++;

    var typeArr = (d.types==='all') ? ALL_TYPES : d.types;
    var badgesHtml = typeArr.map(function(t){
      var short = t.replace('車道乗入れ','車道').replace('歩道乗入れ','歩道');
      var bg = t.indexOf('車道')>=0 ? '#dbeafe' : '#dcfce7';
      var co = t.indexOf('車道')>=0 ? '#1d4ed8' : '#166534';
      return '<span style="display:inline-block;padding:2px 6px;border-radius:6px;font-size:13px;font-weight:700;background:'+bg+';color:'+co+';margin:1px 2px;">'+short+'</span>';
    }).join('');

    var noteHtml = d.note
      ? '<div style="font-size:14px;color:#555;margin-top:5px;padding:5px 8px;background:#f9f8f5;border-radius:6px;border-left:2px solid #d0cfc8;line-height:1.6;white-space:pre-wrap;">'+d.note+'</div>'
      : '';
    var unitHtml = d.unit
      ? '<span style="display:inline-block;padding:2px 8px;border-radius:5px;font-size:14px;font-weight:700;background:#dbeafe;color:#1d4ed8;margin-left:5px;white-space:pre-wrap;">'+d.unit+'</span>'
      : '';
    var linkHtml = d.url
      ? '<a href="'+d.url+'" target="_blank" style="display:inline-flex;align-items:center;padding:5px 10px;border:1px solid #7030a0;border-radius:7px;font-size:14px;font-weight:700;color:#7030a0;text-decoration:none;background:#ede7f6;flex-shrink:0;white-space:nowrap;">📷 見本</a>'
      : '';

    var el = document.createElement('div');
    el.style.cssText = 'background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.04);';
    el.innerHTML =
      '<div style="display:flex;align-items:flex-start;gap:8px;">'
      +'<span style="font-size:21px;font-weight:900;color:#94a3b8;min-width:26px;line-height:1.4;">'+no+'</span>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">'
      +'<span style="font-size:17px;font-weight:700;color:var(--text1);">'+d.name+'</span>'
      +unitHtml
      +'</div>'
      +'<div style="margin-top:4px;">'+badgesHtml+'</div>'
      +noteHtml
      +'</div>'
      +linkHtml
      +'</div>';
    c.appendChild(el);
  });
  if(no===0){
    c.innerHTML='<div style="text-align:center;color:var(--text3);padding:30px;font-size:17px;">該当する品目がありません</div>';
  }
}

var _warnToast = null, _warnTimer = null;
function _hideWarningBanner() { if (_warnToast) _warnToast.style.transform = 'translateY(-100%)'; }
function showWarningBanner(msg, focusId) {
  var el = focusId ? document.getElementById(focusId) : null;
  if (!_warnToast) {
    _warnToast = document.createElement('div');
    _warnToast.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#ef4444;color:#fff;font-size:18px;font-weight:700;padding:18px 20px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.4);transform:translateY(-100%);transition:transform 0.25s;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;';
    document.body.appendChild(_warnToast);
    _warnToast.addEventListener('click', function() {
      _hideWarningBanner();
      if (_warnToast._targetEl) { _warnToast._targetEl.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(function(){ if(_warnToast._targetEl) _warnToast._targetEl.focus(); }, 350); }
    });
  }
  _warnToast._targetEl = el || null;
  _warnToast.innerHTML = '⚠️ ' + msg + (el ? '　<span style="text-decoration:underline;font-size:15px;">（ここをタップして移動）</span>' : '');
  _warnToast.style.transform = 'translateY(0)';
  clearTimeout(_warnTimer);
  _warnTimer = setTimeout(_hideWarningBanner, 6000);
}

  <div class="guide-body">
    <div class="guide-section">
      <div class="guide-label">📌 なぜ撮るか（目的）</div>
      <div class="guide-why" id="guide-why-text"></div>
    </div>
    <div class="guide-section">
      <div class="guide-label">📷 撮り方・ポイント</div>
      <div class="guide-how" id="guide-how-text"></div>
    </div>
  </div>
</div>
<!-- ウィザードモーダル -->
<div id="wizModal" onclick="if(event.target===this)hideWizard()">
  <div class="wiz-card">
    <div class="wiz-header">
      <h2>📋 入力ウィザード</h2>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="wiz-viewer-btn" onclick="_wizOpenViewer()" title="図面を別タブで開く">📐 図面</button>
        <button class="wiz-skip" onclick="hideWizard()">スキップ →</button>
      </div>
    </div>
    <div class="wiz-progress"><div class="wiz-progress-bar" id="wizProgressBar" style="width:5%"></div></div>
    <div class="wiz-body" id="wizBody"></div>
    <div class="wiz-footer">
      <button class="wiz-btn-back" id="wizBtnBack" onclick="_wizBack()">← 戻る</button>
      <button class="wiz-btn-skip" id="wizBtnSkipStep" onclick="_wizSkipStep()" style="display:none">後で入力</button>
      <button class="wiz-btn-next" id="wizBtnNext" onclick="_wizNext()">次へ →</button>
    </div>
  </div>
</div>
</body>
</html>
