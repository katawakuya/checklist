<style>
:root{
  --green-dark:#1B4332;
  --green-light:#B7D4C0;
  --green-bg:#F1F6F3;
  --navy-dark:#2E4057;
  --navy-light:#C8D8E8;
  --navy-bg:#EEF3F8;
  --accent-blue:#3D5A80;
  --gray-bg:#F8FAFC;
  --border:#D9E1E7;
  --text:#222;
  --check-on:#2E7D32;
  --check-off:#9AA5AE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#E9EEF1;color:var(--text);font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;}
button, select, input, textarea{font-family:inherit;font-size:16px;}
input, textarea, select{border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;background:#fff;min-height:44px;}
textarea{resize:vertical;min-height:44px;line-height:1.4;}
button{cursor:pointer;min-height:44px;border-radius:8px;border:none;}

/* ---------- Top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.06);}
#topbar h1{font-size:17px;margin:0 14px 0 0;color:var(--green-dark);white-space:nowrap;}
.tb-btn{padding:10px 14px;background:var(--gray-bg);border:1px solid var(--border);color:var(--text);font-weight:600;}
.tb-btn.primary{background:var(--green-dark);color:#fff;border-color:var(--green-dark);}
.tb-btn.navy{background:var(--navy-dark);color:#fff;border-color:var(--navy-dark);}
/* 共通アプリナビ */
#navbar{position:sticky;top:0;z-index:60;background:var(--green-dark);padding:6px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.hd-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.hd-btn:hover{background:rgba(255,255,255,.25);}
@media print{ #navbar,#topbar{display:none !important;} }
#saveStatus{margin-left:auto;font-size:13px;color:#6b7a83;white-space:nowrap;}

/* ---------- Layout ---------- */
#appWrap{max-width:1400px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
.headerCard{background:#fff;border-radius:14px;border:1px solid var(--border);padding:16px;}
.headerCard h2{margin:0 0 12px 0;font-size:15px;color:#555;}
.fieldGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:#666;margin-bottom:4px;}

#panels{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:980px){ #panels{grid-template-columns:1fr 1fr;} }

.panel{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.panel-head{padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.panel-head.green{background:var(--green-dark);}
.panel-head.navy{background:var(--navy-dark);}
.panel-head h2{margin:0;font-size:18px;}
.progressBadge{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;}

.panel-body{padding:12px;}

/* accordion section */
.section{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.section-head{padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.green .section-head{background:var(--green-light);color:var(--green-dark);}
.navy .section-head{background:var(--navy-light);color:var(--navy-dark);}
.section-head .chev{transition:transform .15s;font-size:12px;}
.section.closed .section-head .chev{transform:rotate(-90deg);}
.section.closed .section-body{display:none;}
.section-body{padding:10px 12px;background:#fff;}
.section-badge{font-size:12px;background:#fff;border-radius:12px;padding:2px 9px;font-weight:700;}
.green .section-badge{color:var(--green-dark);}
.navy .section-badge{color:var(--navy-dark);}

/* item row */
.itemRow{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 6px;border-bottom:1px dashed var(--border);}
.itemRow:last-child{border-bottom:none;}
.itemTop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.itemLabel{font-weight:700;font-size:14px;color:#333;flex:1;}
.itemNo{display:inline-block;min-width:22px;text-align:center;background:var(--navy-dark);color:#fff;border-radius:6px;font-size:12px;padding:2px 5px;margin-right:6px;}
.itemControls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.checkToggle{min-width:52px;height:40px;font-weight:800;font-size:16px;color:#fff;background:var(--check-off);border-radius:8px;padding:0 10px;}
.checkToggle.on{background:var(--check-on);}
.assignSelect{width:110px;min-height:40px;padding:6px 8px;font-size:13px;}
.itemInputWrap textarea, .itemInputWrap input{width:100%;}
.rmBtn{background:none;color:#c0392b;font-size:13px;border:1px solid #eecfcf;padding:6px 10px;min-height:36px;}

/* worker table */
.workerTable{width:100%;border-collapse:collapse;margin-bottom:8px;}
.workerTable th{font-size:12px;color:#666;text-align:left;padding:4px 4px;}
.workerTable td{padding:4px;}
.workerTable input{min-height:40px;padding:8px;}
.workerRow .checkToggle{min-width:44px;height:40px;}

.addBtn{margin-top:6px;background:var(--gray-bg);border:1px dashed var(--border);color:#555;width:100%;padding:10px;font-weight:600;}

/* history modal */
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modalOverlay.show{display:flex;}
.modalBox{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:18px;}
.modalBox h3{margin-top:0;}
.histItem{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.histItem .info{flex:1;cursor:pointer;}
.histItem .info b{display:block;font-size:15px;}
.histItem .info span{font-size:12px;color:#777;}
.histDel{background:#fdecea;color:#c0392b;padding:8px 10px;font-size:13px;}
.closeModal{margin-top:8px;width:100%;background:var(--gray-bg);border:1px solid var(--border);padding:10px;font-weight:600;}
.emptyHist{color:#888;text-align:center;padding:20px 0;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;}
.toast.show{opacity:.92;}

@media print{
  #topbar, .addBtn, .rmBtn, .tb-btn{display:none !important;}
  body{background:#fff;}
  #appWrap{padding:0;max-width:100%;}
  .section.closed .section-body{display:block !important;}
  .section.closed .section-head .chev{display:none;}
  .panel, .headerCard, .section{break-inside:avoid;border-color:#999;}
  @page{size:A3 landscape;margin:10mm;}
}

<script>
(function(){
  // [ファイル, アイコン, 表記, ゲストにも出すか]
  var APPS = [
    ['index.html',        '🏠', 'ホーム',         1],
    ['order.html',        '📊', '発注計算',       1],
    ['checklist.html',    '📋', 'チェックリスト', 1],
    ['viewer.html',       '📐', '図面',           1],
    ['manage.html',       '📈', '班別集計',       1],
    ['zaimatsu.html',     '📦', '資材管理',       1],
    ['daily-report.html', '📝', '作業日報',       1],
    ['meeting.html',      '🗒', '議事録',         1],
    ['roadbed.html',      '🗺', '路盤マスタ',     0],
    ['pdf-crop.html',     '✂️', '断面図切出し',   0]
  ];
  // 匿名認証＝ゲスト。メールでログインした人だけフル表示にする
  function _navFull(here){
    var me = APPS.filter(function(a){ return a[0].toLowerCase() === here; })[0];
    if (me && !me[3]) return true;
    try { var u = firebase.auth().currentUser; return !!(u && !u.isAnonymous); }
    catch(e) { return false; }
  }
  function build(){
    var slot = document.getElementById('appNav');
    if (!slot) return;
    var here = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    var full = _navFull(here);
    slot.style.display = 'contents';
    slot.innerHTML = APPS.filter(function(a){ return a[3] || full; }).map(function(a){
      var cur = (a[0].toLowerCase() === here);
      var st = cur ? ' style="font-weight:700;box-shadow:inset 0 0 0 1.5px currentColor;"' : '';
      return '<a href="' + a[0] + '" class="hd-btn"' + st + (cur ? ' aria-current="page"' : '')
           + ' title="' + a[2] + '">' + a[1] + ' ' + a[2] + '</a>';
    }).join('');
  }
  function _navSub(n){
    try { firebase.auth().onAuthStateChanged(build); }
    catch(e) { if (n > 0) setTimeout(function(){ _navSub(n - 1); }, 600); }
  }
  function boot(){ build(); _navSub(8); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

  sectionsData.forEach(sec=>{
    rec.sections[sec.id] = { items:{}, custom:[] };
    sec.items.forEach(it=> rec.sections[sec.id].items[it.id] = {content:'', confirm:'', assign:''});
    if(sec.itemsAfter) sec.itemsAfter.forEach(it=> rec.sections[sec.id].items[it.id] = {content:'', confirm:'', assign:''});
    if(sec.hasWorkers){
      rec.sections[sec.id].workers = DEFAULT_WORKERS.map(w=>({...w}));
    }
  });
  checklistData.forEach(g=>{
    rec.checklist[g.id] = { items:{}, custom:[] };
    g.items.forEach(it=> rec.checklist[g.id].items[it.no] = {check:'', assign:'', note:''});
  });
  return rec;
}

/* ========================= ストレージ ========================= */
function loadAllRecords(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; }
}
function saveAllRecords(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function getCurrentId(){ return localStorage.getItem(CURRENT_KEY); }
function setCurrentId(id){ localStorage.setItem(CURRENT_KEY, id); }

let currentRecord = null;
let saveTimer = null;

function initRecord(){
  const list = loadAllRecords();
  const curId = getCurrentId();
  let rec = list.find(r=>r.id===curId);
  if(!rec){
    if(list.length>0){
      rec = list.sort((a,b)=>b.updatedAt-a.updatedAt)[0];
    } else {
      rec = buildDefaultRecord();
      list.push(rec);
      saveAllRecords(list);
    }
  }
  setCurrentId(rec.id);
  currentRecord = rec;
}

function persist(showToast){
  currentRecord.updatedAt = Date.now();
  let list = loadAllRecords();
  const idx = list.findIndex(r=>r.id===currentRecord.id);
  if(idx>=0) list[idx] = currentRecord; else list.push(currentRecord);
  saveAllRecords(list);
  document.getElementById('saveStatus').textContent = '保存済み ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  if(showToast) doToast();
}

function scheduleSave(){
  document.getElementById('saveStatus').textContent = '編集中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>persist(false), 500);
}

function doToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ========================= path util ========================= */
function getDeep(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function setDeep(obj, path, value){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++){ o = o[keys[i]]; }
  o[keys[keys.length-1]] = value;
}

/* ========================= レンダリング ========================= */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function makeCheckToggle(path, colorClassOn='on'){
  const val = getDeep(currentRecord, path) === '✓';
  const btn = el('button',{class:'checkToggle'+(val?' on':''), type:'button', 'data-path':path});
  btn.textContent = val ? '✓ 確認' : '－ 未';
  btn.addEventListener('click', ()=>{
    const cur = getDeep(currentRecord, path);
    const next = cur==='✓' ? '' : '✓';
    setDeep(currentRecord, path, next);
    btn.classList.toggle('on', next==='✓');
    btn.textContent = next==='✓' ? '✓ 確認' : '－ 未';
    scheduleSave();
    updateProgress();
  });
  return btn;
}

function makeAssignSelect(path){
  const sel = el('select',{class:'assignSelect','data-path':path});
  ASSIGN_OPTIONS.forEach(opt=>{
    const o = el('option',{value:opt}, opt===''?'担当?':opt);
    sel.appendChild(o);
  });
  sel.value = getDeep(currentRecord, path) || '';
  sel.addEventListener('change', ()=>{ setDeep(currentRecord, path, sel.value); scheduleSave(); });
  return sel;
}

function makeTextInput(path, placeholder, multiline){
  const input = el(multiline?'textarea':'input', {class:'', 'data-path':path, placeholder: placeholder||''});
  input.value = getDeep(currentRecord, path) || '';
  input.addEventListener('input', ()=>{ setDeep(currentRecord, path, input.value); scheduleSave(); });
  return input;
}

function renderLeftPanel(){
  const body = document.getElementById('leftBody');
  body.innerHTML = '';
  sectionsData.forEach(sec=>{
    const secState = currentRecord.sections[sec.id];
    const total = sec.items.length + (sec.itemsAfter?sec.itemsAfter.length:0) + secState.custom.length;
    let doneCount = 0;
    sec.items.forEach(it=>{ if(secState.items[it.id].confirm==='✓') doneCount++; });
    if(sec.itemsAfter) sec.itemsAfter.forEach(it=>{ if(secState.items[it.id].confirm==='✓') doneCount++; });
    secState.custom.forEach(c=>{ if(c.confirm==='✓') doneCount++; });

    const isOpen = openState['L_'+sec.id] !== false; // default open
    const wrap = el('div',{class:'section green'+(isOpen?'':' closed')});
    const head = el('div',{class:'section-head'},[
      el('span',{},sec.title),
      el('span',{},[ el('span',{class:'section-badge'}, `${doneCount}/${total}`), el('span',{class:'chev'},'▼') ])
    ]);
    head.addEventListener('click', ()=>{ openState['L_'+sec.id] = wrap.classList.toggle('closed') ? false : true; });
    const bodyDiv = el('div',{class:'section-body'});

    sec.items.forEach(it=> bodyDiv.appendChild(renderLeftItem(sec.id, it)));

    if(sec.hasWorkers){
      bodyDiv.appendChild(renderWorkerTable(sec.id));
    }
    if(sec.itemsAfter) sec.itemsAfter.forEach(it=> bodyDiv.appendChild(renderLeftItem(sec.id, it)));

    secState.custom.forEach((c,idx)=> bodyDiv.appendChild(renderLeftCustomItem(sec.id, idx)));

    const addBtn = el('button',{class:'addBtn', type:'button'}, '＋ 項目を追加');
    addBtn.addEventListener('click', ()=>{
      secState.custom.push({label:'', content:'', confirm:'', assign:''});
      scheduleSave();
      renderLeftPanel();
    });
    bodyDiv.appendChild(addBtn);

    wrap.appendChild(head);
    wrap.appendChild(bodyDiv);
    body.appendChild(wrap);
  });
}

function renderLeftItem(secId, it){
  const base = `sections.${secId}.items.${it.id}`;
  const row = el('div',{class:'itemRow'});
  const top = el('div',{class:'itemTop'},[
    el('span',{class:'itemLabel'}, it.label),
  ]);
  const controls = el('div',{class:'itemControls'});
  controls.appendChild(makeCheckToggle(base+'.confirm'));
  if(it.assign) controls.appendChild(makeAssignSelect(base+'.assign'));
  top.appendChild(controls);
  row.appendChild(top);
  row.appendChild(el('div',{class:'itemInputWrap'}, makeTextInput(base+'.content','内容・回答を入力')));
  return row;
}

function renderLeftCustomItem(secId, idx){
  const base = `sections.${secId}.custom.${idx}`;
  const c = currentRecord.sections[secId].custom[idx];
  const row = el('div',{class:'itemRow'});
  const labelInput = el('input',{placeholder:'項目名', style:'font-weight:700;margin-bottom:4px;'});
  labelInput.value = c.label || '';
  labelInput.addEventListener('input', ()=>{ c.label = labelInput.value; scheduleSave(); });

  const controls = el('div',{class:'itemControls'});
  controls.appendChild(makeCheckToggle(base+'.confirm'));
  controls.appendChild(makeAssignSelect(base+'.assign'));
  const rmBtn = el('button',{class:'rmBtn',type:'button'},'削除');
  rmBtn.addEventListener('click', ()=>{
    currentRecord.sections[secId].custom.splice(idx,1);
    scheduleSave();
    renderLeftPanel();
  });
  controls.appendChild(rmBtn);

  const top = el('div',{class:'itemTop'},[labelInput, controls]);
  row.appendChild(top);
  row.appendChild(el('div',{class:'itemInputWrap'}, makeTextInput(base+'.content','内容・回答を入力')));
  return row;
}

function renderWorkerTable(secId){
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'itemLabel', style:'margin:6px 0;'}, '施工担当者'));
  const table = el('table',{class:'workerTable'});
  table.appendChild(el('tr',{},[
    el('th',{style:'width:26%'},'会社'), el('th',{style:'width:26%'},'氏名'), el('th',{style:'width:26%'},'TEL'), el('th',{style:'width:22%'},'確認')
  ]));
  currentRecord.sections[secId].workers.forEach((w, idx)=>{
    const base = `sections.${secId}.workers.${idx}`;
    const tr = el('tr',{class:'workerRow'});
    ['company','name','tel'].forEach(f=>{
      const td = el('td',{});
      td.appendChild(makeTextInput(base+'.'+f, f==='company'?'会社':f==='name'?'氏名':'TEL'));
      tr.appendChild(td);
    });
    const tdc = el('td',{});
    tdc.appendChild(makeCheckToggle(base+'.confirm'));
    tr.appendChild(tdc);
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  return wrap;
}

function renderRightPanel(){
  const body = document.getElementById('rightBody');
  body.innerHTML = '';
  checklistData.forEach(g=>{
    const gState = currentRecord.checklist[g.id];
    const total = g.items.length + gState.custom.length;
    let doneCount = 0;
    g.items.forEach(it=>{ if(gState.items[it.no].check==='✓') doneCount++; });
    gState.custom.forEach(c=>{ if(c.check==='✓') doneCount++; });

    const isOpen = openState['R_'+g.id] !== false;
    const wrap = el('div',{class:'section navy'+(isOpen?'':' closed')});
    const head = el('div',{class:'section-head'},[
      el('span',{},g.title),
      el('span',{},[ el('span',{class:'section-badge'}, `${doneCount}/${total}`), el('span',{class:'chev'},'▼') ])
    ]);
    head.addEventListener('click', ()=>{ openState['R_'+g.id] = wrap.classList.toggle('closed') ? false : true; });
    const bodyDiv = el('div',{class:'section-body'});

    g.items.forEach(it=> bodyDiv.appendChild(renderRightItem(g.id, it)));
    gState.custom.forEach((c,idx)=> bodyDiv.appendChild(renderRightCustomItem(g.id, idx)));

    const addBtn = el('button',{class:'addBtn', type:'button'}, '＋ 確認事項を追加');
    addBtn.addEventListener('click', ()=>{
      const maxNo = getMaxChecklistNo();
      gState.custom.push({no:maxNo+1, label:'', check:'', assign:'', note:''});
      scheduleSave();
      renderRightPanel();
      updateProgress();
    });
    bodyDiv.appendChild(addBtn);

    wrap.appendChild(head);
    wrap.appendChild(bodyDiv);
    body.appendChild(wrap);
  });
  updateProgress();
}

function getMaxChecklistNo(){
  let max = 0;
  checklistData.forEach(g=> g.items.forEach(it=>{ if(it.no>max) max=it.no; }));
  Object.values(currentRecord.checklist).forEach(gs=> gs.custom.forEach(c=>{ if(c.no>max) max=c.no; }));
  return max;
}

function renderRightItem(gId, it){
  const base = `checklist.${gId}.items.${it.no}`;
  const row = el('div',{class:'itemRow'});
  const top = el('div',{class:'itemTop'},[
    el('span',{class:'itemLabel'},[ el('span',{class:'itemNo'}, String(it.no)), it.label ]),
  ]);
  const controls = el('div',{class:'itemControls'});
  const chk = makeCheckToggle(base+'.check');
  controls.appendChild(chk);
  controls.appendChild(makeAssignSelect(base+'.assign'));
  top.appendChild(controls);
  row.appendChild(top);
  row.appendChild(el('div',{class:'itemInputWrap'}, makeTextInput(base+'.note','備考・回答')));
  return row;
}

function renderRightCustomItem(gId, idx){
  const base = `checklist.${gId}.custom.${idx}`;
  const c = currentRecord.checklist[gId].custom[idx];
  const row = el('div',{class:'itemRow'});
  const labelInput = el('input',{placeholder:'確認事項を入力', style:'font-weight:700;margin-bottom:4px;'});
  labelInput.value = c.label || '';
  labelInput.addEventListener('input', ()=>{ c.label = labelInput.value; scheduleSave(); });

  const controls = el('div',{class:'itemControls'});
  controls.appendChild(makeCheckToggle(base+'.check'));
  controls.appendChild(makeAssignSelect(base+'.assign'));
  const rmBtn = el('button',{class:'rmBtn',type:'button'},'削除');
  rmBtn.addEventListener('click', ()=>{
    currentRecord.checklist[gId].custom.splice(idx,1);
    scheduleSave();
    renderRightPanel();
  });
  controls.appendChild(rmBtn);

  const top = el('div',{class:'itemTop'},[
    el('span',{class:'itemLabel'},[ el('span',{class:'itemNo'}, String(c.no)) ]),
    controls
  ]);
  row.appendChild(top);
  row.appendChild(labelInput);
  row.appendChild(el('div',{class:'itemInputWrap'}, makeTextInput(base+'.note','備考・回答')));
  return row;
}

function updateProgress(){
  let total=0, done=0;
  checklistData.forEach(g=>{
    g.items.forEach(it=>{ total++; if(currentRecord.checklist[g.id].items[it.no].check==='✓') done++; });
    currentRecord.checklist[g.id].custom.forEach(c=>{ total++; if(c.check==='✓') done++; });
  });
  document.getElementById('progressBadge').textContent = `${done} / ${total} 件確認済み`;
}

function renderHeaderFields(){
  ['siteName','meetingDate','contractor','shikoHan','tantosha'].forEach(k=>{
    const input = document.getElementById('f_'+k);
    input.value = currentRecord[k] || (k==='meetingDate' ? todayISO() : '');
    input.oninput = ()=>{ currentRecord[k] = input.value; scheduleSave(); refreshHistTitle(); };
  });
}

function renderAll(){
  renderHeaderFields();
  renderLeftPanel();
  renderRightPanel();
}

/* ========================= 履歴モーダル ========================= */
function openHistory(){
  const list = loadAllRecords().sort((a,b)=>b.updatedAt-a.updatedAt);
  const histList = document.getElementById('histList');
  histList.innerHTML = '';
  if(list.length===0){
    histList.appendChild(el('div',{class:'emptyHist'},'履歴はありません'));
  }
  list.forEach(r=>{
    const item = el('div',{class:'histItem'});
    const info = el('div',{class:'info'},[
      el('b',{}, (r.siteName||'（現場名未入力）') + (r.id===currentRecord.id?'　【編集中】':'')),
      el('span',{}, `${r.meetingDate||''}　${r.contractor||''}　更新: ${new Date(r.updatedAt).toLocaleString('ja-JP')}`)
    ]);
    info.addEventListener('click', ()=>{
      persist(false);
      currentRecord = r;
      setCurrentId(r.id);
      renderAll();
      closeHistory();
    });
    const delBtn = el('button',{class:'histDel',type:'button'},'削除');
    delBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('この記録を削除しますか？')) return;
      let all = loadAllRecords().filter(x=>x.id!==r.id);
      saveAllRecords(all);
      if(r.id===currentRecord.id){
        if(all.length>0){ currentRecord = all.sort((a,b)=>b.updatedAt-a.updatedAt)[0]; }
        else { currentRecord = buildDefaultRecord(); saveAllRecords([currentRecord]); }
        setCurrentId(currentRecord.id);
        renderAll();
      }
      openHistory();
    });
    item.appendChild(info);
    item.appendChild(delBtn);
    histList.appendChild(item);
  });
  document.getElementById('histModal').classList.add('show');
}
function closeHistory(){ document.getElementById('histModal').classList.remove('show'); }

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

const LEFT_ROW_MAP = {
  'basic.chief':7, 'basic.staff':8, 'basic.tel':9, 'basic.orgchart':17,
  'schedule.process':19, 'schedule.weekly':20, 'schedule.general_plan':21, 'schedule.crane_plan':22, 'schedule.retaining_plan':23, 'schedule.site_map':24,
  'transport.route':26, 'transport.time':27, 'transport.tool_time':28, 'transport.traffic_rule':29, 'transport.vehicle_pass':30,
  'safety.work_hours':32, 'safety.morning':33, 'safety.emergency':34, 'safety.complaint':35, 'safety.parking':36, 'safety.green_site':37,
  'insurance.move_in':39, 'insurance.labor_ins':40, 'insurance.sub_adjust':41,
};
const WORKER_START_ROW = 11;
const LEFT_CUSTOM_START_ROW = 42;
const LEFT_CUSTOM_MAX_ROW = 63;

const CHECKLIST_ROW_MAP = {1:7,2:8,3:10,4:11,5:12,6:13,7:14,8:15,9:16,10:17,11:18,12:19,13:20,14:22,15:23,16:24,17:26,18:27,19:28,20:29,21:31,22:32,23:33,24:35};
const RIGHT_CUSTOM_START_ROW = 36;
const RIGHT_CUSTOM_MAX_ROW = 63;

function formatDateJP(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

function writeLeftItem(ws, secId, it){
  const row = LEFT_ROW_MAP[secId+'.'+it.id];
  if(!row) return;
  const d = currentRecord.sections[secId].items[it.id];
  ws.getCell('B'+row).value = d.content || '';
  ws.getCell('E'+row).value = d.confirm || '';
  if(it.assign) ws.getCell('F'+row).value = d.assign || '';
}

async function exportToExcel(){
  if(typeof ExcelJS === 'undefined'){
    alert('Excel出力機能の読み込みに失敗しました。インターネット接続を確認してから、もう一度お試しください。');
    return;
  }
  const btn = document.getElementById('btnExcel');
  const origText = btn.textContent;
  btn.textContent = '出力中…';
  btn.disabled = true;
  try{
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(base64ToArrayBuffer(TEMPLATE_BASE64));
    const ws = wb.getWorksheet('A3打ち合わせ');

    ws.getCell('B2').value = currentRecord.siteName || '';
    ws.getCell('B3').value = formatDateJP(currentRecord.meetingDate);
    ws.getCell('B4').value = currentRecord.contractor || '';
    ws.getCell('I2').value = currentRecord.shikoHan || '';
    ws.getCell('I4').value = currentRecord.tantosha || '';

    sectionsData.forEach(sec=>{
      sec.items.forEach(it=> writeLeftItem(ws, sec.id, it));
      if(sec.itemsAfter) sec.itemsAfter.forEach(it=> writeLeftItem(ws, sec.id, it));
    });

    const workers = currentRecord.sections.basic.workers;
    workers.forEach((w, idx)=>{
      const r = WORKER_START_ROW + idx;
      ws.getCell('B'+r).value = w.company || '';
      ws.getCell('C'+r).value = w.name || '';
      ws.getCell('D'+r).value = w.tel || '';
      ws.getCell('E'+r).value = w.confirm || '';
    });

    let leftCustomRow = LEFT_CUSTOM_START_ROW;
    sectionsData.forEach(sec=>{
      currentRecord.sections[sec.id].custom.forEach(c=>{
        if(leftCustomRow > LEFT_CUSTOM_MAX_ROW) return;
        ws.getCell('A'+leftCustomRow).value = c.label || '';
        ws.getCell('B'+leftCustomRow).value = c.content || '';
        ws.getCell('E'+leftCustomRow).value = c.confirm || '';
        ws.getCell('F'+leftCustomRow).value = c.assign || '';
        leftCustomRow++;
      });
    });

    checklistData.forEach(g=>{
      g.items.forEach(it=>{
        const r = CHECKLIST_ROW_MAP[it.no];
        const d = currentRecord.checklist[g.id].items[it.no];
        ws.getCell('J'+r).value = d.check || '';
        ws.getCell('K'+r).value = d.assign || '';
        ws.getCell('L'+r).value = d.note || '';
      });
    });

    let rightCustomRow = RIGHT_CUSTOM_START_ROW;
    checklistData.forEach(g=>{
      currentRecord.checklist[g.id].custom.forEach(c=>{
        if(rightCustomRow > RIGHT_CUSTOM_MAX_ROW) return;
        ws.getCell('H'+rightCustomRow).value = c.no || '';
        ws.getCell('I'+rightCustomRow).value = c.label || '';
        ws.getCell('J'+rightCustomRow).value = c.check || '';
        ws.getCell('K'+rightCustomRow).value = c.assign || '';
        ws.getCell('L'+rightCustomRow).value = c.note || '';
        rightCustomRow++;
      });
    });

    wb.calcProperties.fullCalcOnLoad = true;

    const outBuf = await wb.xlsx.writeBuffer();
    const blob = new Blob([outBuf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fname = `打ち合わせ議事録_${currentRecord.siteName||'現場'}_${currentRecord.meetingDate||''}.xlsx`;
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }catch(e){
    console.error(e);
    alert('Excel出力に失敗しました: '+e.message);
  }finally{
    btn.textContent = origText;
    btn.disabled = false;
  }
}

document.getElementById('btnNew').addEventListener('click', ()=>{
  if(!confirm('新しい記録を作成します。現在の内容は履歴に保存されます。よろしいですか？')) return;
  persist(false);
  currentRecord = prefillBasicInfo(buildDefaultRecord());

/* =====================================================================
   版管理（確定版と修正版）
     下書き   … 打合せ当日。上書きしながら育てる
     確定版   … 最終編集から20時間、または「確定」ボタンで固定
     修正版   … 確定後に手を入れたもの。差分とアラートの対象
   ===================================================================== */
var CONFIRM_MS = 20 * 60 * 60 * 1000;   // 20時間で自動確定

function _norm(v){ return String(v==null?'':v).trim(); }
function _recKey(r){ return _norm(r.siteName) + '|' + _norm(r.meetingDate); }

// 保存した人の情報。表示欄とは別に記録し、後から書き換えられないようにする
function _authorInfo(){
  var u = (_fbAuth && _fbAuth.currentUser) ? _fbAuth.currentUser : null;
  return {
    authorUid:  u ? u.uid : '',
    authorRole: _isAdmin ? 'admin' : 'guest',
    authorName: localStorage.getItem('order_recorder')
             || localStorage.getItem('checklist_recorder') || '',
    authorCompany: localStorage.getItem('myCompany') || '',
    authorTeam:    localStorage.getItem('myTeam') || ''
  };
}

// 新規作成時に基本情報をログイン者の所属で埋める（入力欄は編集可のまま）
function prefillBasicInfo(rec){
  var a = _authorInfo();
  if (!_norm(rec.contractor) && a.authorCompany) rec.contractor = a.authorCompany;
  if (!_norm(rec.shikoHan)   && a.authorTeam)    rec.shikoHan   = a.authorTeam;
  if (!_norm(rec.tantosha)   && a.authorName)    rec.tantosha   = a.authorName;
  return rec;
}

/* ---- 差分（どの項目が変わったか） ---- */
function _labelOf(kind, gid, key){
  var i, g, it;
  if (kind === 'sec'){
    for (i=0;i<sectionsData.length;i++){
      g = sectionsData[i]; if (g.id !== gid) continue;
      var all = (g.items||[]).concat(g.itemsAfter||[]);
      for (var j=0;j<all.length;j++) if (all[j].id === key) return g.title.replace('▶ ','') + ' ＞ ' + all[j].label;
      return g.title.replace('▶ ','') + ' ＞ ' + key;
    }
  } else {
    for (i=0;i<checklistData.length;i++){
      g = checklistData[i]; if (g.id !== gid) continue;
      for (var k=0;k<g.items.length;k++) if (String(g.items[k].no) === String(key))
        return 'チェック No.' + key + ' ' + g.items[k].label;
      return 'チェック No.' + key;
    }
  }
  return gid + ' ＞ ' + key;
}
var _FLD = {content:'内容', confirm:'確認', assign:'担当', check:'チェック', note:'備考'};

// レコードを「項目ラベル → 値」の平らな形にする
function _flatten(r){
  var out = {};
  if (!r) return out;
  ['siteName','meetingDate','contractor','shikoHan','tantosha'].forEach(function(k){
    var lbl = {siteName:'現場名',meetingDate:'打合せ日',contractor:'施工業者',shikoHan:'施工班',tantosha:'担当者'}[k];
    out['基本情報 ＞ ' + lbl] = _norm(r[k]);
  });
  Object.keys(r.sections||{}).forEach(function(gid){
    var sec = r.sections[gid] || {};
    Object.keys(sec.items||{}).forEach(function(key){
      var it = sec.items[key] || {};
      Object.keys(_FLD).forEach(function(f){
        if (it[f] === undefined) return;
        out[_labelOf('sec', gid, key) + '（' + _FLD[f] + '）'] = _norm(it[f]);
      });
    });
    (sec.custom||[]).forEach(function(c, i){
      out[_labelOf('sec', gid, '追加項目' + (i+1))] = _norm(c && (c.label||'') ) + ' / ' + _norm(c && (c.content||''));
    });
    (sec.workers||[]).forEach(function(w, i){
      out['作業員 ' + (i+1)] = [_norm(w.name), _norm(w.role), _norm(w.note)].filter(Boolean).join(' / ');
    });
  });
  Object.keys(r.checklist||{}).forEach(function(gid){
    var g = r.checklist[gid] || {};
    Object.keys(g.items||{}).forEach(function(no){
      var it = g.items[no] || {};
      Object.keys(_FLD).forEach(function(f){
        if (it[f] === undefined) return;
        out[_labelOf('chk', gid, no) + '（' + _FLD[f] + '）'] = _norm(it[f]);
      });
    });
    (g.custom||[]).forEach(function(c, i){
      out['チェック ' + gid + ' 追加' + (i+1)] = _norm(c && (c.label||'')) + ' / ' + _norm(c && (c.note||''));
    });
  });
  return out;
}

function diffRecords(oldRec, newRec){
  var A = _flatten(oldRec), B = _flatten(newRec), keys = {}, out = [];
  Object.keys(A).forEach(function(k){ keys[k]=1; });
  Object.keys(B).forEach(function(k){ keys[k]=1; });
  Object.keys(keys).forEach(function(k){
    var a = A[k] === undefined ? '' : A[k];
    var b = B[k] === undefined ? '' : B[k];
    if (a !== b) out.push({ label:k, before:a, after:b });
  });
  return out;
}

/* ---- クラウドへの保存（下書きは上書き・確定後は版を積む） ---- */
function _cloudDoc(rec, suffix){
  return _initFb().collection(MEETING_COL).doc(String(rec.id) + (suffix||''));
}
function _cloudPayload(rec, status, version, changes){
  // 確定スナップショットは端末側だけで持つ。クラウドに入れると容量が倍になるうえ、
  // JSON化で undefined を除いておかないと Firestore が書き込みを拒否する
  var clean = JSON.parse(JSON.stringify(Object.assign({}, rec, { confirmedSnapshot: undefined })));
  return Object.assign({}, _authorInfo(), {
    id: rec.id, recKey: _recKey(rec), recSite: _norm(rec.siteName), recDate: _norm(rec.meetingDate),
    status: status, version: version,
    confirmedAt: rec.confirmedAt || null,
    data: clean,
    changes: changes || [],
    ack: false, ackBy: '', ackAt: null,
    savedAt: new Date().toISOString()
  });
}

// 認証が済むまで待つ（ルールが isLoggedIn() を要求するため、
// ここを待たずに書き込むと permission-denied で黙って失敗する）
var _authResolved = false;
function _ensureAuth(){
  if (!_fbAuth) _initFb();
  if (!_fbAuth) return Promise.reject(new Error('Firebaseに接続できません'));
  if (_fbAuth.currentUser) return Promise.resolve(_fbAuth.currentUser);
  // 保存済みのログインが復元されるのを待つ。
  // 待たずに匿名サインインすると、管理者のログインを匿名で上書きしてしまう
  return new Promise(function(resolve, reject){
    var un = _fbAuth.onAuthStateChanged(function(u){
      un();
      if (u) return resolve(u);
      _fbAuth.signInAnonymously().then(function(r){ resolve(r.user); }).catch(reject);
    });
  });
}

// クラウド保存の失敗を必ず画面に出す（黙って消えないようにする）
function _cloudFail(e, where){
  console.error('[FB] ' + where, e);
  var code = (e && e.code) || '';
  var msg;
  if (code === 'permission-denied') {
    msg = 'Firestoreのルールで拒否されました。meeting_records のルールが公開されているかご確認ください。';
  } else if (code === 'auth/admin-restricted-operation' || code === 'auth/operation-not-allowed') {
    msg = 'Firebaseの「匿名認証」が無効です。Authentication → Sign-in method → 匿名 を有効にしてください。'
        + '（管理者としてログインすれば、この設定なしでも保存できます）';
  } else {
    msg = (e && e.message) || String(e);
  }
  setCloudStatus('⚠ クラウド保存に失敗：' + msg);
  return msg;
}

// ゲストも会社に保存する。ただし自分が作ったものだけ更新できる（ルールで担保）
function fbSaveMeeting(rec){
  var db = _initFb();
  if (!db) return Promise.resolve(false);
  if (!_norm(rec.siteName)) return Promise.resolve(false);   // 現場名が無いうちは送らない
  var doIt = function(){
    if (!rec.confirmedAt){
      // 下書き: 同じドキュメントを上書き
      return _cloudDoc(rec).set(_cloudPayload(rec, 'draft', 0, []))
        .then(function(){ return true; });
    }
    // 確定後は自動で版を作らない。
    // 入力のたびに版が増えると履歴が埋まってしまうので、
    // クラウドへ残すのは「☁ 変更を記録」を押したときだけにする。
    return Promise.resolve(true);
  };
  return _ensureAuth().then(doIt).catch(function(e){ _cloudFail(e, 'save'); return false; });
}

// 確定（手動／自動 共通）
function confirmRecord(manual){
  if (!_norm(currentRecord.siteName)){ if(manual) alert('現場名を入力してください'); return; }
  if (currentRecord.confirmedAt){ if(manual) reconfirmRecord(); return; }
  if (manual && !confirm('この内容で確定しますか？\n\n確定後の変更はすべて「修正版」として記録され、\n起動時に変更ありの警告が出ます。')) return;
  currentRecord.confirmedAt = new Date().toISOString();
  currentRecord.confirmedSnapshot = JSON.parse(JSON.stringify(
    Object.assign({}, currentRecord, {confirmedSnapshot:undefined})));
  currentRecord.cloudVersion = 1;
  persist(false);
  setCloudStatus('確定版をクラウドへ送信中…');
  _ensureAuth()
    .then(function(){ return _cloudDoc(currentRecord, '__v1').set(_cloudPayload(currentRecord, 'confirmed', 1, [])); })
    .then(function(){ setCloudStatus('✅ 確定版をクラウドに保存しました（第1版）'); })
    .catch(function(e){
      var msg = _cloudFail(e, 'confirm');
      if (manual) alert('確定しましたが、クラウドに保存できませんでした。\n\n' + msg
        + '\n\nこの端末には保存されています。通信が戻ったら「☁ 変更を記録」で送れます。');
    });
  renderConfirmState();
  if (manual) doToast();
}

// 確定後に手を入れた分を、新しい版としてクラウドへ記録する
var _pushing = false;
function pushRevision(){
  if (_pushing) return;
  if (!currentRecord.confirmedAt){ alert('先に「✅ 確定」を押してください'); return; }
  persist(false);
  var base = currentRecord.confirmedSnapshot || null;
  var changes = base ? diffRecords(base, currentRecord) : [];
  if (!changes.length){
    alert('確定版からの変更はありません。');
    setCloudStatus('変更なし');
    return;
  }
  if (!confirm(changes.length + 'か所の変更を記録します。\n\n'
    + changes.slice(0,5).map(function(c){ return '・' + c.label; }).join('\n')
    + (changes.length > 5 ? '\n…ほか ' + (changes.length-5) + '件' : '')
    + '\n\nよろしいですか？')) return;
  var v = (currentRecord.cloudVersion || 1) + 1;
  _pushing = true;
  setCloudStatus('変更をクラウドへ送信中…');
  _ensureAuth()
    .then(function(){ return _cloudDoc(currentRecord, '__v' + v).set(_cloudPayload(currentRecord, 'revised', v, changes)); })
    .then(function(){
      currentRecord.cloudVersion = v;
      persist(false);
      renderConfirmState();
      setCloudStatus('⚠ 確定後の変更 ' + changes.length + '件を第' + v + '版として記録しました');
      doToast();
    })
    .catch(function(e){ alert('クラウドに記録できませんでした。\n\n' + _cloudFail(e, 'revision')); })
    .then(function(){ _pushing = false; }, function(){ _pushing = false; });
}

// いまの内容を新しい確定版にし直す（打合せで変更を承認したとき）
function reconfirmRecord(){
  if (!currentRecord.confirmedAt){ confirmRecord(true); return; }
  var base = currentRecord.confirmedSnapshot || null;
  var changes = base ? diffRecords(base, currentRecord) : [];
  if (!confirm('いまの内容を新しい確定版にします。\n\n'
    + (changes.length ? '確定版からの変更 ' + changes.length + '件を承認した扱いになり、\n以降はこの内容が比較の基準になります。'
                      : '確定版からの変更はありません。')
    + '\n\nよろしいですか？')) return;
  var v = (currentRecord.cloudVersion || 1) + 1;
  currentRecord.confirmedAt = new Date().toISOString();
  currentRecord.confirmedSnapshot = JSON.parse(JSON.stringify(
    Object.assign({}, currentRecord, {confirmedSnapshot:undefined})));
  currentRecord.cloudVersion = v;
  persist(false);
  setCloudStatus('再確定版をクラウドへ送信中…');
  _ensureAuth()
    .then(function(){ return _cloudDoc(currentRecord, '__v' + v).set(_cloudPayload(currentRecord, 'confirmed', v, changes)); })
    .then(function(){ setCloudStatus('✅ 第' + v + '版として再確定しました'); doToast(); })
    .catch(function(e){ alert('クラウドに保存できませんでした。\n\n' + _cloudFail(e, 'reconfirm')); });
  renderConfirmState();
}

// 20時間たった下書きを自動で確定する
function autoConfirmSweep(){
  var list = loadAllRecords(), changed = false;
  list.forEach(function(r){
    if (r.confirmedAt) return;
    if (!_norm(r.siteName)) return;
    if (Date.now() - (r.updatedAt||0) < CONFIRM_MS) return;
    r.confirmedAt = new Date().toISOString();
    r.confirmedSnapshot = JSON.parse(JSON.stringify(Object.assign({}, r, {confirmedSnapshot:undefined})));
    r.cloudVersion = 1;
    changed = true;
    (function(rec){
      _ensureAuth()
        .then(function(){ return _cloudDoc(rec, '__v1').set(_cloudPayload(rec, 'confirmed', 1, [])); })
        .catch(function(e){ _cloudFail(e, 'autoConfirm'); });
    })(r);
  });
  if (changed){
    saveAllRecords(list);
    var cur = list.find(function(x){ return x.id === currentRecord.id; });
    if (cur) currentRecord = cur;
    renderConfirmState();
  }
}

function renderConfirmState(){
  var btn  = document.getElementById('btnConfirm');
  var btnR = document.getElementById('btnRevision');
  var btnC = document.getElementById('btnReconfirm');
  var st   = document.getElementById('confirmState');
  if (!btn || !st) return;
  if (currentRecord.confirmedAt){
    btn.style.display  = 'none';
    if (btnR) btnR.style.display = '';
    if (btnC) btnC.style.display = '';
    var d = new Date(currentRecord.confirmedAt);
    var v = currentRecord.cloudVersion || 1;
    // 未送信の変更が残っていないか毎回みる
    var base = currentRecord.confirmedSnapshot || null;
    var n = base ? diffRecords(base, currentRecord).length : 0;
    st.innerHTML = '<span style="color:#2E7D32;font-weight:700;">✅ 確定済み '
      + (d.getMonth()+1) + '/' + d.getDate() + '（第' + v + '版）</span>'
      + (n ? ' <span style="color:#c62828;font-weight:700;">⚠ 未記録の変更 ' + n + '件</span>' : '');
  } else {
    btn.style.display = '';
    if (btnR) btnR.style.display = 'none';
    if (btnC) btnC.style.display = 'none';
    st.textContent = '下書き（最終編集から20時間で自動確定）';
  }
}

/* ---- クラウド一覧（議事録ごとに版を並べる） ---- */
var _cloudCache = [];
function openCloudList(){
  var db = _initFb();
  var box = document.getElementById('cloudList');
  document.getElementById('cloudModal').classList.add('show');
  if (!db){ box.textContent = 'クラウドに接続できませんでした。'; return; }

  _ensureAuth()
    .then(function(){ return db.collection(MEETING_COL).get(); })

      renderCloudList();

var _STATUS_LABEL = { draft:'下書き', confirmed:'確定版', revised:'修正版' };

function renderCloudList(){
  var box = document.getElementById('cloudList');
  if (!_cloudCache.length){ box.textContent = 'クラウドに議事録がありません。'; return; }
  // 議事録（現場＋打合せ日）ごとにまとめ、版を新しい順に並べる
  var g = {};
  _cloudCache.forEach(function(v){
    var k = v.recKey || ((v.recSite||'') + '|' + (v.recDate||''));
    if (!g[k]) g[k] = { site:v.recSite||'(現場名未設定)', date:v.recDate||'(日付未設定)', rows:[] };
    g[k].rows.push(v);
  });
  var groups = Object.keys(g).map(function(k){ return g[k]; })
    .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

  box.innerHTML = groups.map(function(gr){
    gr.rows.sort(function(a,b){ return (b.version||0) - (a.version||0); });
    var latest = gr.rows.filter(function(r){ return r.status !== 'draft'; })[0] || gr.rows[0];
    var vers = gr.rows.filter(function(r){ return r.status !== 'draft'; });
    return '<div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;">'
      + '<div style="font-weight:700;font-size:14px;">' + esc(gr.site) + '　' + esc(gr.date) + '</div>'
      + '<div style="font-size:12px;color:#667;margin-bottom:6px;">版の数：' + vers.length + '</div>'
      + (vers.length ? '<table style="width:100%;border-collapse:collapse;font-size:12px;">'
          + '<tr style="background:var(--gray-bg);"><th style="text-align:left;padding:4px 6px;">版</th>'
          + '<th style="text-align:left;padding:4px 6px;">種別</th>'
          + '<th style="text-align:left;padding:4px 6px;">日時</th>'
          + '<th style="text-align:left;padding:4px 6px;">記録者</th>'
          + '<th style="text-align:left;padding:4px 6px;">変更</th></tr>'
          + vers.map(function(r){
              var isRev = (r.status === 'revised');
              return '<tr style="border-top:1px solid var(--border);' + (isRev ? 'background:#fff6f6;' : '') + '">'
                + '<td style="padding:4px 6px;font-weight:700;">第' + (r.version||1) + '版</td>'
                + '<td style="padding:4px 6px;' + (isRev ? 'color:#c62828;font-weight:700;' : 'color:#2E7D32;') + '">'
                + (_STATUS_LABEL[r.status] || r.status) + '</td>'
                + '<td style="padding:4px 6px;">' + _fmtDT(r.savedAt) + '</td>'
                + '<td style="padding:4px 6px;">' + esc(_who(r)) + '</td>'
                + '<td style="padding:4px 6px;">'
                + ((r.changes||[]).length
                    ? '<a href="#" onclick="showChanges(\'' + r._docId + '\');return false;">' + r.changes.length + 'か所</a>'
                    : '—')
                + (r.ack ? ' <span style="color:#2E7D32;">✓確認済</span>' : '') + '</td></tr>';
            }).join('')
          + '</table>' : '<div style="font-size:12px;color:#999;">まだ確定されていません（下書きのみ）</div>')
      + '<div style="margin-top:8px;">'
      + '<button class="tb-btn" onclick="importCloudMeeting(\'' + latest._docId + '\')">最新版をこの端末で開く</button>'
      + '</div></div>';
  }).join('');
}

function importCloudMeeting(docId){
  var v = _cloudCache.filter(function(x){ return x._docId === docId; })[0];
  if (!v) return;
  var rec = v.data || v;            // 新形式は data の中に議事録本体が入っている
  if (!rec || !rec.id){ alert('この版には議事録データが入っていません'); return; }
  var list = loadAllRecords();
  var i = list.findIndex(function(x){ return x.id === rec.id; });
  var copy = JSON.parse(JSON.stringify(rec));
  if (i > -1) list[i] = copy; else list.unshift(copy);
  saveAllRecords(list);
  setCurrentId(copy.id);
  currentRecord = copy;
  renderAll();
  prefillBasicInfo(currentRecord);
  renderHeaderFields();
  renderConfirmState();
  document.getElementById('cloudModal').classList.remove('show');
  doToast();
}

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

function importCloudMeeting(id){
  var r=_cloudCache.filter(function(x){ return String(x.id)===String(id); })[0];
  if(!r) return;
  var list=loadAllRecords();
  var i=list.findIndex(function(x){ return x.id===r.id; });
  var rec=Object.assign({}, r, {fbSent:true});
  if(i>-1) list[i]=rec; else list.unshift(rec);
  saveAllRecords(list);
  setCurrentId(rec.id);
  currentRecord=rec;
  renderAll();
  document.getElementById('cloudModal').classList.remove('show');
  doToast();
}

/* =====================================================================
   PDF出力（LINE共有）と PDFからの復元
   見た目は画面そのまま。復元用データは画像の下に隠したテキストとして埋める
   ===================================================================== */
var DATA_MARK_START = '[[KANRO_MTG_START]]';
var DATA_MARK_END   = '[[KANRO_MTG_END]]';
function encodeMeeting(r){ return btoa(unescape(encodeURIComponent(JSON.stringify(r)))); }
function decodeMeeting(b64){ return JSON.parse(decodeURIComponent(escape(atob(b64)))); }

function _isMobileDevice(){
  var ua=navigator.userAgent||'';
  if(/Android|iPhone|iPod|iPad/i.test(ua)) return true;
  if(/Macintosh/.test(ua) && navigator.maxTouchPoints>1) return true;
  return false;
}
function _meetingFileName(r){
  var d=(r.meetingDate||'日付未設定').replace(/-/g,'');
  var n=(r.siteName||'現場').replace(/[\\\/:*?"<>|]/g,'_');
  return '議事録_'+d+'_'+n+'.pdf';
}

async function _buildMeetingPDF(rec){
  if(!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF){
    throw new Error('PDF作成の準備ができていません。通信環境を確認して画面を再読み込みしてください。');
  }
  document.querySelectorAll('.section.closed').forEach(function(x){ x.classList.remove('closed'); });
  var area=document.getElementById('appWrap');
  var canvas=await html2canvas(area,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});

  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  var PW=210,PH=297,M=8;
  var imgW=PW-M*2, pxPerMm=canvas.width/imgW, pageHpx=(PH-M*2)*pxPerMm;

  // ① 復元データを白文字で先に書く（このあと画像を上に重ねるので見えない）
  var payload=DATA_MARK_START+encodeMeeting(rec)+DATA_MARK_END;
  doc.setFontSize(1); doc.setTextColor(255,255,255);
  var CH=200, ln=0, i;
  for(i=0;i<payload.length;i+=CH){
    doc.text(payload.slice(i,i+CH), M, M+2+ln*1.1); ln++;
    if(M+2+ln*1.1>PH-M) break;
  }
  var rest = payload.length>CH*ln ? payload.slice(CH*ln) : '';

  // ② 本体を分割して重ねる
  var y=0,page=0;
  while(y<canvas.height){
    var sh=Math.min(pageHpx, canvas.height-y);
    var t=document.createElement('canvas');
    t.width=canvas.width; t.height=Math.round(sh);
    var tc=t.getContext('2d');
    tc.fillStyle='#ffffff'; tc.fillRect(0,0,t.width,t.height);
    tc.drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);
    if(page>0) doc.addPage();
    doc.addImage(t.toDataURL('image/jpeg',0.92),'JPEG',M,M,imgW,sh/pxPerMm);
    y+=sh; page++;
  }
  if(rest){
    doc.setFontSize(1); doc.setTextColor(255,255,255);
    var l2=0;
    for(i=0;i<rest.length;i+=CH){
      if(M+2+l2*1.1>PH-M){ doc.addPage(); doc.setFontSize(1); doc.setTextColor(255,255,255); l2=0; }
      doc.text(rest.slice(i,i+CH), M, M+2+l2*1.1); l2++;
    }
  }
  return doc;
}

async function shareMeetingPDF(){
  var btn=document.getElementById('btnShare');
  var orig=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='作成中…'; }
  try{
    persist(false);
    var doc=await _buildMeetingPDF(currentRecord);
    var blob=doc.output('blob');
    var name=_meetingFileName(currentRecord);
    var file=new File([blob], name, {type:'application/pdf'});
    var canShare=!!(navigator.canShare && navigator.canShare({files:[file]}));
    var useShare=canShare;
    if(canShare && !_isMobileDevice()){
      useShare = !confirm('パソコンのLINEは共有メニューからファイルを受け取れないことがあります。\n\n'
        +'［OK］PDFを保存する（保存後、LINEのトークにドラッグして送れます）\n'
        +'［キャンセル］このまま共有メニューを開く');
    }
    if(useShare){
      await navigator.share({files:[file], title:name,
        text:(currentRecord.meetingDate||'')+' '+(currentRecord.siteName||'')+' 打ち合わせ議事録'});
      setCloudStatus('共有しました');
    } else {
      doc.save(name);
      setCloudStatus(canShare?'PDFを保存しました。LINEのトークにドラッグして送れます':'ダウンロードしました');
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
    console.error('[share]',e);
    alert('PDFの作成に失敗しました。\n'+(e.message||e)+'\n\n「🖨 印刷」から保存もできます。');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=orig; }
  }
}

async function importMeetingPDF(evt){
  var file=evt.target.files[0];
  evt.target.value='';
  if(!file) return;
  if(!window.pdfjsLib){ alert('PDF読み込みの準備ができていません。通信環境を確認してください。'); return; }
  setCloudStatus('PDFを読み込んでいます…');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var buf=await file.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    var full='';
    for(var i=1;i<=pdf.numPages;i++){
      var pg=await pdf.getPage(i);
      var ct=await pg.getTextContent();
      full+=ct.items.map(function(it){ return it.str; }).join(' ')+' ';
    }
    var a=full.indexOf(DATA_MARK_START), b=full.indexOf(DATA_MARK_END);
    if(a===-1||b===-1||b<a){
      alert('このPDFには議事録アプリの復元データが見つかりませんでした。\nこのアプリの「📤 LINEに送る」で作ったPDFのみ取り込めます。');
      setCloudStatus(''); return;
    }
    var rec=decodeMeeting(full.slice(a+DATA_MARK_START.length,b).replace(/\s+/g,''));
    var list=loadAllRecords();
    var idx=list.findIndex(function(x){ return x.id===rec.id; });
    if(idx>-1){
      if(!confirm('同じ議事録がこの端末にあります（'+(rec.meetingDate||'')+' / '+(rec.siteName||'')+'）。\n上書きしますか？')){ setCloudStatus(''); return; }
      list[idx]=Object.assign({}, rec, {fbSent:false});
    } else {
      list.unshift(Object.assign({}, rec, {fbSent:false}));
    }
    saveAllRecords(list);
    setCurrentId(rec.id);
    currentRecord=loadAllRecords().find(function(x){ return x.id===rec.id; });
    renderAll();
    setCloudStatus('📄 PDFから復元しました');
    doToast();
  }catch(err){
    console.error(err);
    alert('PDFの読み込みに失敗しました。ファイルをご確認ください。');
    setCloudStatus('');
  }
}

/* ---- 保存時にクラウドへも送る（管理者のみ） ---- */
/* =====================================================================
   変更アラート（確定後に書き換えられた議事録を知らせる）
   ===================================================================== */
var _alerts = [];
function loadChangeAlerts(){
  var db = _initFb();
  if (!db) return;
  // 認証が済む前に読むと permission-denied になるので必ず待つ
  _ensureAuth().then(function(){
  return db.collection(MEETING_COL).where('status','==','revised').get(); }).then(function(snap){
    _alerts = [];
    snap.forEach(function(d){
      var v = d.data();
      if (!v.ack) _alerts.push(Object.assign({_docId:d.id}, v));
    });
    _alerts.sort(function(a,b){ return String(b.savedAt||'').localeCompare(String(a.savedAt||'')); });
    renderAlertBanner();
  }).catch(function(e){ console.warn('[alert]', e); });
}

function _fmtDT(iso){
  if (!iso) return '';
  var d = new Date(iso);
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function _who(v){
  var n = v.authorName || '(名前未設定)';
  return n + '（' + (v.authorRole === 'admin' ? '管理者' : 'ゲスト') + '）';
}

// 同じ議事録の修正版はひとまとめにして出す（版ごとに並べると埋まってしまう）
function _groupAlerts(){
  var g = {};
  _alerts.forEach(function(v){
    var k = v.recKey || (v.recSite + '|' + v.recDate);
    if (!g[k]) g[k] = { key:k, site:v.recSite, date:v.recDate, docIds:[], total:0, latest:v };
    g[k].docIds.push(v._docId);
    g[k].total += (v.changes||[]).length;
    if (String(v.savedAt||'') > String(g[k].latest.savedAt||'')) g[k].latest = v;
  });
  return Object.keys(g).map(function(k){ return g[k]; })
    .sort(function(a,b){ return String(b.latest.savedAt||'').localeCompare(String(a.latest.savedAt||'')); });
}

function renderAlertBanner(){
  var box = document.getElementById('alertBanner');
  if (!box) return;
  var groups = _groupAlerts();
  if (!groups.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display = '';
  box.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">'
    + '<span style="font-weight:700;">⚠ 確定後に変更された議事録が ' + groups.length + '件あります</span>'
    + (groups.length > 1 ? '<button class="tb-btn" style="margin-left:auto;" onclick="ackAll()">すべて確認済みにする</button>' : '')
    + '</div>'
    + groups.map(function(g){
        var v = g.latest;
        return '<div style="background:#fff;border:1px solid #f0b3b3;border-radius:8px;padding:8px 10px;margin-top:6px;">'
          + '<div style="font-weight:700;">' + esc(g.site) + '　' + esc(g.date) + ' の議事録</div>'
          + '<div style="font-size:12px;color:#8a1c1c;">' + _fmtDT(v.savedAt) + ' に ' + esc(_who(v)) + ' が '
          + g.total + 'か所 変更'
          + (g.docIds.length > 1 ? '（' + g.docIds.length + '回にわたって修正）' : '') + '</div>'
          + '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">'
          + '<button class="tb-btn" onclick="showChanges(\'' + v._docId + '\')">変更箇所を見る</button>'
          + '<button class="tb-btn" onclick="ackGroup(\'' + g.key + '\')">確認済みにする</button>'
          + '</div></div>';
      }).join('');
}

// 同じ議事録の修正版をまとめて確認済みにする
function ackGroup(key){
  var g = _groupAlerts().filter(function(x){ return x.key === key; })[0];
  if (!g) return;
  Promise.all(g.docIds.map(_ackOne)).then(function(){
    _alerts = _alerts.filter(function(x){ return g.docIds.indexOf(x._docId) < 0; });
    renderAlertBanner();
    document.getElementById('cloudModal').classList.remove('show');
    setCloudStatus('確認済みにしました');
  }).catch(function(e){ alert('確認済みにできませんでした: ' + (e.message || e)); });
}
function ackAll(){
  if (!confirm('表示中の変更をすべて確認済みにします。よろしいですか？')) return;
  var ids = _alerts.map(function(x){ return x._docId; });
  Promise.all(ids.map(_ackOne)).then(function(){
    _alerts = [];
    renderAlertBanner();
    setCloudStatus('すべて確認済みにしました');
  }).catch(function(e){ alert('確認済みにできませんでした: ' + (e.message || e)); });
}
function _ackOne(docId){
  var db = _initFb();
  if (!db) return Promise.reject(new Error('未接続'));
  var a = _authorInfo();
  return db.collection(MEETING_COL).doc(docId).update({
    ack: true, ackBy: (a.authorName || a.authorRole), ackAt: new Date().toISOString()
  });
}

function showChanges(docId){
  var v = _alerts.filter(function(x){ return x._docId === docId; })[0];
  if (!v) return;
  var box = document.getElementById('cloudList');
  document.getElementById('cloudModal').classList.add('show');
  box.innerHTML =
    '<div style="font-weight:700;margin-bottom:4px;">' + esc(v.recSite) + '　' + esc(v.recDate) + ' の議事録</div>'
    + '<div style="font-size:12px;color:#667;margin-bottom:10px;">'
      + _fmtDT(v.savedAt) + '　' + esc(_who(v)) + '　第' + v.version + '版</div>'
    + (v.changes||[]).map(function(c){
        return '<div style="border-left:3px solid #c62828;background:#fff6f6;padding:8px 10px;margin-bottom:8px;border-radius:0 8px 8px 0;">'
          + '<div style="font-weight:700;font-size:13px;">' + esc(c.label) + '</div>'
          + '<div style="font-size:12px;color:#777;margin-top:4px;">確定版：' + (esc(c.before) || '（空欄）') + '</div>'
          + '<div style="font-size:13px;color:#c62828;font-weight:700;">現在　：' + (esc(c.after) || '（空欄）') + '</div>'
          + '</div>';
      }).join('')
    + '<button class="tb-btn primary" style="width:100%;margin-top:6px;" onclick="ackChange(\'' + docId + '\')">この変更を確認済みにする</button>';
}

function ackChange(docId){
  var v = _alerts.filter(function(x){ return x._docId === docId; })[0];
  if (v) { ackGroup(v.recKey || (v.recSite + '|' + v.recDate)); return; }
  _ackOne(docId).then(function(){
    _alerts = _alerts.filter(function(x){ return x._docId !== docId; });
    renderAlertBanner();
    document.getElementById('cloudModal').classList.remove('show');
    setCloudStatus('確認済みにしました');
  }).catch(function(e){ alert('確認済みにできませんでした: ' + (e.message || e)); });
}

/* =====================================================================
   前回の打合せ議事録パネル（同じ現場の直前の打合せ日）
   ===================================================================== */
function loadPrevMeeting(){
  var box = document.getElementById('prevPanel');
  if (!box) return;
  var site = _norm(currentRecord.siteName), date = _norm(currentRecord.meetingDate);
  if (!site || !date){ box.style.display='none'; return; }
  var db = _initFb();
  if (!db){ box.style.display='none'; return; }
  _ensureAuth().then(function(){
  return db.collection(MEETING_COL).where('recSite','==',site).get(); }).then(function(snap){
    var rows = [];
    snap.forEach(function(d){ var v=d.data(); if (v.recDate && v.recDate < date) rows.push(Object.assign({_docId:d.id}, v)); });
    if (!rows.length){ box.style.display='none'; return; }
    // 直前の打合せ日
    var lastDate = rows.map(function(r){ return r.recDate; }).sort().pop();
    var sameDay = rows.filter(function(r){ return r.recDate === lastDate; })
                      .sort(function(a,b){ return (a.version||0) - (b.version||0); });
    var revised = sameDay.filter(function(r){ return r.status === 'revised'; });
    box.style.display = '';
    var html = '<div style="font-weight:700;">📌 前回の打合せ：' + esc(site) + '　' + esc(lastDate) + '</div>';
    if (!revised.length){
      html += '<div style="font-size:12px;color:#2E7D32;margin-top:4px;">確定版のまま変更はありません</div>';
    } else {
      var all = [];
      revised.forEach(function(r){ (r.changes||[]).forEach(function(c){ all.push(Object.assign({_r:r}, c)); }); });
      html += '<div style="font-size:13px;color:#c62828;font-weight:700;margin-top:4px;">⚠ 確定後に ' + all.length + 'か所 変更されています</div>'
        + all.map(function(c){
            return '<div style="border-left:3px solid #c62828;background:#fff6f6;padding:6px 10px;margin-top:6px;border-radius:0 8px 8px 0;">'
              + '<div style="font-weight:700;font-size:13px;">' + esc(c.label) + '</div>'
              + '<div style="font-size:12px;color:#777;">確定版：' + (esc(c.before)||'（空欄）') + '</div>'
              + '<div style="font-size:13px;color:#c62828;">現在　：' + (esc(c.after)||'（空欄）') + '</div>'
              + '<div style="font-size:11px;color:#8a1c1c;margin-top:2px;">' + _fmtDT(c._r.savedAt) + '　' + esc(_who(c._r)) + '</div>'
              + '</div>';
          }).join('')
        + '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">'
        + revised.filter(function(r){ return !r.ack; }).map(function(r){
            return '<button class="tb-btn primary" onclick="ackChange(\'' + r._docId + '\')">この変更を確認済みにする</button>';
          }).join('')
        + '</div>';
    }
    box.innerHTML = html;
  }).catch(function(e){ console.warn('[prev]', e); box.style.display='none'; });
}

/* ---- 保存フック：ローカル保存 → クラウドへ ---- */
var _persistOrig = persist;
persist = function(showToast){
  _persistOrig(showToast);
  fbSaveMeeting(currentRecord).then(function(ok){
    if (ok && !currentRecord.confirmedAt) setCloudStatus('☁ クラウド保存済み');
  });
  renderConfirmState();
};
